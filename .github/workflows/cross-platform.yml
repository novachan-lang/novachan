name: NOVA Cross-Platform CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# SUPERSEDE, don't queue. Every push spawns a full matrix, and each macOS job runs ~90 minutes
# while the free runner pool serialises them -- so pushing six fixes in a row queued six matrices
# and self-inflicted most of a day of latency waiting on results for code that was already
# obsolete. Only the newest commit on a branch is worth testing, so cancel the older ones.
#
# Scoped per ref so master and a PR never cancel each other. NOT applied to the individual jobs:
# the group must cover the whole run, or one job could be cancelled while its siblings continue
# and the run would report a conclusion drawn from half a matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  # ─── Windows: full 114-test regression + benchmarks ───────────────
  windows-full-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          clang --version
          Write-Host "CPU: $([System.Environment]::ProcessorCount) cores"

      # The step ran bare `_run_final_regression.ps1`, which is the FULL suite (3,590 tests as of
      # 2026-08-27), not the 114 the old label claimed. One mode takes ~25 min on a fast dev box,
      # so a 20-minute cap could never pass -- every run died on the clock, not on a test. The
      # hosted runner has fewer cores than a dev machine, hence 90. GitHub's hard job ceiling is
      # 6 h, so this is still well inside it.
      # DIAGNOSTICS, for the same reason the macOS job has them: the Actions LOGS endpoint is 403
      # without a token, so a bare `exit 1` here is unreadable -- we learn the run failed and
      # nothing whatsoever about which test. ::error::/::notice:: become ANNOTATIONS, which the
      # public API DOES expose. Tee keeps the human-readable log intact while letting us scrape
      # the FAIL lines and the RESULTS summary back out.
      - name: Run full regression suite (all ~3,590 tests, NORMAL mode)
        shell: pwsh
        run: |
          Set-Location nova-compiler/test_programs
          # POSTGRES. GitHub's windows-latest image ships PostgreSQL PREINSTALLED and exports
          # PGUSER/PGPASSWORD, but leaves the SERVICE STOPPED. _kat_pg_replace is written to skip
          # cleanly when PGPASSWORD is empty -- but because the image sets it, the test does NOT
          # skip: it tries to connect to a server that is not running, fails, and exit(1)s.
          # Try to start the bundled service so the PG tests genuinely RUN (a stronger gate than
          # skipping). If it cannot start, clear PGPASSWORD so they take their designed skip path
          # instead of failing on an absent server. Either way the outcome is reported.
          $pgsvc = Get-Service -Name postgresql* -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pgsvc) {
            try { Start-Service $pgsvc.Name -ErrorAction Stop; Start-Sleep -Seconds 5 } catch { }
            $pgsvc.Refresh()
          }
          if ($pgsvc -and $pgsvc.Status -eq 'Running') {
            Write-Host "::notice title=Windows postgres::$($pgsvc.Name) RUNNING -- PG tests will execute for real"
          } else {
            $env:PGPASSWORD = ""
            Write-Host "::notice title=Windows postgres::no running PG service; PGPASSWORD cleared so PG tests take their designed skip path"
          }
          # MUST be a CHILD PROCESS, not `& .\script.ps1`. _run_final_regression.ps1 ends with
          # `exit 1`, and in PowerShell an `exit` inside a script invoked with `&` tears down the
          # CALLING script as well -- so the annotation code below never ran and the first attempt
          # at diagnostics produced nothing at all. A separate pwsh process cannot do that, and
          # $LASTEXITCODE still carries its status.
          pwsh -NoProfile -File .\\_run_final_regression.ps1 2>&1 | Tee-Object -FilePath regression.log
          $code = $LASTEXITCODE
          $all = @(Get-Content regression.log -ErrorAction SilentlyContinue)
          $summary = @($all | Where-Object { $_ -match 'RESULTS:' }) -join ' '
          if ($summary) { Write-Host "::notice title=Windows regression summary::$summary" }
          # WARN lines matter as much as FAIL ones: a failed sqlite/runtime PRE-COMPILE is only
          # a WARN, yet it makes every dependent test fail downstream with a misleading error.
          # Scraping only ^FAIL hid exactly that.
          $warns = @($all | Where-Object { $_ -match '^(WARN|sqlite3_test\.o|Pre-compiling)' } | Select-Object -First 6)
          if ($warns.Count -gt 0) { Write-Host "::notice title=Windows regression setup::$(($warns -join ' | '))" }
          $fails = @($all | Where-Object { $_ -match '^(FAIL|TIMEOUT)' } | Select-Object -First 20)
          if ($fails.Count -gt 0) {
            Write-Host "::error title=Windows regression FAILS ($($fails.Count) shown)::$(($fails -join ' | '))"
          } elseif ($code -ne 0) {
            # ONLY meaningful when the run actually failed. This branch used to fire on SUCCESS
            # too, so a clean 3592 PASS / 0 FAIL was reported as "suite likely died early" --
            # a false alarm that would teach a future reader to distrust a genuine green.
            Write-Host "::error title=Windows regression::exit=$code but no FAIL line matched -- the suite died before reporting; see the setup notice above"
          }
          exit $code
        timeout-minutes: 90

      - name: Run benchmark suite
        shell: pwsh
        run: |
          if (Test-Path "bench/run_bench.ps1") {
            Set-Location bench
            & .\\run_bench.ps1
          } else {
            Write-Host "No bench suite found, skipping"
          }
        timeout-minutes: 10

  # ─── Linux: self-hosted compiler (the LIVE compiler, not Kotlin) ───
  linux-selfhosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
          clang --version

      # nova_compiler_linux.ll is the checked-in BOOTSTRAP SEED: the compiler's own IR, emitted
      # with --target linux so it carries the ELF datalayout (e-m:e) rather than the Windows one.
      # This is the chicken-and-egg break -- you need a NOVA compiler to build the NOVA compiler,
      # so one generation ships as IR. Regenerate with:
      #     nova compile --target linux -o nova_compiler_linux.ll nova_compiler.nova
      - name: Build self-hosted compiler from checked-in Linux bootstrap IR
        run: |
          cd nova-compiler/compiler
          test -f nova_compiler_linux.ll || { echo "bootstrap IR missing"; exit 1; }
          grep -q 'x86_64-unknown-linux-gnu' nova_compiler_linux.ll || { echo "bootstrap IR is not Linux-targeted"; exit 1; }
          clang -O2 -o nova nova_compiler_linux.ll nova_runtime.c -lpthread -ldl -lm -Wno-everything
          echo "Built native Linux compiler:"
          ls -la nova
          ./nova --version

      # A native host must pick its OWN triple. Before native_target_triple() landed,
      # resolve_target("") was hardcoded to Windows, so a Linux build silently emitted
      # x86_64-pc-windows-msvc. Assert the compiler self-identifies as Linux.
      - name: Native host targeting
        run: |
          cd nova-compiler/compiler
          printf 'fn main()\n    print(os_name())\n' > /tmp/hostprobe.nova
          ./nova compile -o /tmp/hostprobe.ll /tmp/hostprobe.nova
          grep -q 'target triple = "x86_64-unknown-linux-gnu"' /tmp/hostprobe.ll \
            || { echo "FAIL: native build did not target Linux"; grep '^target ' /tmp/hostprobe.ll; exit 1; }
          echo "OK: native host targeting resolves to Linux"

      - name: Reconverge check (gen5 == gen6)
        run: |
          cd nova-compiler/compiler
          export NOVA_NO_CACHE=1
          # NOTE: bare `-o` is NOT a top-level flag -- `nova <in.nova> <out.ll>` is positional.
          # (`nova compile -o <out> <in>` is the flag form, used in the probe step above.)
          echo "=== gen5: compile compiler with itself ==="
          ./nova nova_compiler.nova gen5.ll
          echo "=== Build gen5 binary ==="
          clang -O2 -o nova_gen5 gen5.ll nova_runtime.c -lpthread -ldl -lm -Wno-everything
          echo "=== gen6: compile compiler with gen5 ==="
          ./nova_gen5 nova_compiler.nova gen6.ll
          echo "=== Compare gen5 vs gen6 ==="
          if diff -q gen5.ll gen6.ll; then
            echo "RECONVERGED: gen5 == gen6 (byte-identical)"
          else
            echo "DIVERGED: gen5 != gen6"
            diff gen5.ll gen6.ll | head -40
            exit 1
          fi
          rm -f nova_gen5 gen5.ll gen6.ll
        timeout-minutes: 30

      - name: Run core test suite
        run: |
          cd nova-compiler
          export NOVA_NO_CACHE=1
          export NOVA_HOME="$(pwd)"
          NOVA="compiler/nova"
          RUNTIME="compiler/nova_runtime.c"

          cd test_programs
          PASS=0; FAIL=0; SKIP=0; FAILURES=""

          # PORTABLE KILL-ON-TIMEOUT. `timeout` is GNU coreutils and DOES NOT EXIST on macOS.
          # The macOS run of this step reported 0 PASS / 62 FAIL with EVERY test marked (RUN)
          # for exactly that reason: `timeout: command not found` exits 127, which the loop
          # below read as a run failure. Nothing was wrong with the binaries -- they were never
          # executed at all. Linux stayed green only because coreutils is present there.
          # perl ships on BOTH macOS and Linux and alarm(2) gives the same hard-kill guarantee,
          # so kill-on-timeout still holds and a hung test can never wedge the runner.
          # Linux keeps using coreutils `timeout` (detected first), so its behaviour is unchanged.
          if command -v timeout >/dev/null 2>&1; then
            RUNTMO() { timeout "$@"; }; TMO_KIND="timeout(coreutils)"
          elif command -v gtimeout >/dev/null 2>&1; then
            RUNTMO() { gtimeout "$@"; }; TMO_KIND="gtimeout(brew coreutils)"
          else
            RUNTMO() { perl -e 'alarm shift; exec @ARGV' "$@"; }; TMO_KIND="perl alarm"
          fi
          echo "::notice title=timeout mechanism::$TMO_KIND"

          TESTS=(
            float_test while_test list_test string_test for_test
            closure_test combined_test nested_fn_test
            struct_test struct_advanced_test struct_mutate_test
            match_test match_advanced_test higher_order_test
            enum_test range_test string_methods_test dict_test
            math_test string_stdlib_test list_methods_test
            type_conv_test slice_test defaults_test
            in_operator_test struct_methods_test
            generics_test match_guard_test trait_test
            destructure_test assert_test string_index_test
            string_iter_test string_ops_test
            list_struct_test list_struct_loop_test
            string_accum_test string_accum_fn_test
            codegen_pattern_test match_expr_test
            map_filter_test bitwise_test
            closure_ir_test error_test tiny_test match_str_test
            default_params_test tuple_test method_test
            math_quick_test else_sibling_test
            mini_struct_test mini2_test
            stdlib_test mixed_arith_test
            shadow_test json_float_test nested_float_test
            dict_float_test bool_json_test nested_bool_test
            float_list_ops_test
          )

          for t in "${TESTS[@]}"; do
            nova="${t}.nova"
            ll="${t}.ll"
            exe="${t}"

            if [ ! -f "$nova" ]; then
              SKIP=$((SKIP + 1))
              continue
            fi

            if ! "../${NOVA}" "$nova" > /dev/null 2>&1; then
              echo "FAIL compile: $t"
              FAILURES="$FAILURES $t(COMPILE)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if [ ! -f "$ll" ]; then
              echo "FAIL compile: $t (no .ll)"
              FAILURES="$FAILURES $t(NO_LL)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if ! clang -O2 -o "$exe" "$ll" "../${RUNTIME}" -lpthread -ldl -lm -Wno-everything 2>/dev/null; then
              echo "FAIL link: $t"
              FAILURES="$FAILURES $t(LINK)"
              FAIL=$((FAIL + 1))
              rm -f "$ll"
              continue
            fi

            if RUNTMO 15 ./"$exe" > /tmp/test_out.txt 2>/tmp/test_err.txt; then
              if grep -q "FAIL assert" /tmp/test_err.txt 2>/dev/null; then
                echo "FAIL assert: $t"
                FAILURES="$FAILURES $t(ASSERT)"
                FAIL=$((FAIL + 1))
              else
                echo "PASS $t"
                PASS=$((PASS + 1))
              fi
            else
              EXIT_CODE=$?
              # 124 = GNU timeout's kill code; 142 = 128+SIGALRM, what the perl alarm fallback
              # yields. Both mean "the test hung", and both must be reported as TIMEOUT rather
              # than misfiled as a run failure.
              if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 142 ]; then
                echo "FAIL timeout: $t"
                FAILURES="$FAILURES $t(TIMEOUT)"
              else
                echo "FAIL run: $t (exit=$EXIT_CODE)"
                FAILURES="$FAILURES $t(RUN)"
              fi
              FAIL=$((FAIL + 1))
            fi

            rm -f "$ll" "$exe"
          done

          echo ""
          echo "=== RESULTS: $PASS PASS, $FAIL FAIL, $SKIP SKIP ==="
          if [ -n "$FAILURES" ]; then
            echo "Failures:$FAILURES"
          fi
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ─── Linux (Kotlin bootstrap, legacy reference) ───────
  macos-selfhosted:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify clang
        run: clang --version

      - name: Build self-hosted compiler from checked-in IR
        run: |
          cd nova-compiler/compiler
          # macOS: no -lpthread -ldl needed (part of system libs)
          # nova_compiler_macos.ll is the checked-in BOOTSTRAP SEED, the exact mirror of
          # nova_compiler_linux.ll. Regenerate BOTH from the same commit with:
          #     nova compile --target macos-arm64 -o nova_compiler_macos.ll nova_compiler.nova
          #     nova compile --target linux      -o nova_compiler_linux.ll nova_compiler.nova
          # This job used to build from `nova_compiler.ll`, which is NOT tracked in git, so it
          # failed at `clang: no such file` on every run and macOS was never actually tested.
          # DIAGNOSTICS FIRST. This job failed twice and the Actions logs endpoint returns 403
          # without a token, so the only way to see the cause is to have the job print it.
          # The prime suspect is an arch mismatch: the seed is aarch64-apple-darwin because
          # macos-latest is documented as ARM64, and if this runner is actually x86_64 then clang
          # rejects the module outright. `uname -m` settles it in one line.
          # ::notice:: / ::error:: become ANNOTATIONS, which the REST API exposes WITHOUT a
          # token -- unlike the logs endpoint, which is 403 on a public repo. That is the only
          # channel that gets a diagnostic off this runner and back to a developer who cannot
          # read the logs. Plain `echo` goes only to the log body and is invisible to us.
          echo "::notice title=macOS runner::arch=$(uname -m) clang=$(clang --version | head -1)"
          test -f nova_compiler_macos.ll || { echo 'macOS bootstrap IR missing'; exit 1; }
          echo "::notice title=macOS seed::$(grep -m1 'target triple' nova_compiler_macos.ll)"
          # Guard the triple, exactly as the Linux job does: a seed emitted for the wrong target
          # still compiles far enough to waste the whole run before failing confusingly.
          # macos-latest runners are ARM64, hence aarch64-apple-darwin.
          grep -q 'aarch64-apple-darwin' nova_compiler_macos.ll || { echo 'bootstrap IR is not arm64-macOS-targeted'; exit 1; }
          # 2>&1 | tail so the actual clang diagnostic reaches the job summary even when the
          # log body is unreadable. `set -o pipefail` keeps the step failing on clang's status
          # rather than on tail's success -- without it a broken build reports as green.
          # Capture clang, then re-emit the tail as an ANNOTATION so the real error is readable
          # without log access. pipefail is still required: without it a failing clang would
          # report GREEN because tee succeeded.
          set -o pipefail
          if ! clang -O2 -o nova nova_compiler_macos.ll nova_runtime.c -lm -Wno-everything -D_DARWIN_C_SOURCE 2>&1 | tee /tmp/clang.log; then
            echo "::error title=macOS clang failed::$(tail -c 700 /tmp/clang.log | paste -sd ' ' -)"
            exit 1
          fi
          echo "Built native macOS compiler:"
          ls -la nova
          ./nova --version || true

      # A native host must pick its OWN triple, exactly as the Linux job asserts. Without this a
      # macOS build that silently emitted the Windows triple would still pass the test suite by
      # running through Rosetta-ish luck, and we would not learn until someone shipped.
      - name: Native host targeting
        run: |
          cd nova-compiler/compiler
          printf 'fn main()\n    print(os_name())\n' > /tmp/hostprobe.nova
          ./nova compile -o /tmp/hostprobe.ll /tmp/hostprobe.nova
          grep -q 'target triple = "aarch64-apple-darwin' /tmp/hostprobe.ll \
            || { echo "::error title=macOS targeting::native build did not target arm64-macOS: $(grep '^target ' /tmp/hostprobe.ll)"; exit 1; }
          echo "::notice title=macOS targeting::OK, native host resolves to aarch64-apple-darwin"

      # THE strongest test that exists for a self-hosting compiler: it must compile ITSELF to a
      # byte-identical fixpoint on this OS. Linux has had this; macOS never did, so "macOS works"
      # rested only on ~60 core tests. Mirrors the Linux step exactly.
      # CANONICAL 3-PASS reconverge, matching CLAUDE.md and the Windows arc:
      #   seed -> gen4 -> gen5 -> gen6, then compare gen5 == gen6.
      # This step previously did only TWO generations (seed -> gen5 -> gen6). Linux happens to
      # converge in two, but that is luck, not a guarantee: the seed is cross-produced by the
      # WINDOWS-hosted compiler, so generation 1 still carries the producing host's behaviour and
      # needs one more pass to wash out. macOS diverged on exactly that -- a struct managed-slot
      # bitmap differing in two bits -- which is a one-generation-short signature, not a codegen bug.
      - name: Reconverge check (3-pass, gen5 == gen6)
        run: |
          cd nova-compiler/compiler
          export NOVA_NO_CACHE=1
          CC_ARGS="nova_runtime.c -lm -Wno-everything -D_DARWIN_C_SOURCE"
          echo "=== gen4: seed compiles the compiler ==="
          ./nova nova_compiler.nova gen4.ll
          clang -O2 -o nova_gen4 gen4.ll $CC_ARGS
          echo "=== gen5: gen4 compiles the compiler ==="
          ./nova_gen4 nova_compiler.nova gen5.ll
          clang -O2 -o nova_gen5 gen5.ll $CC_ARGS
          echo "=== gen6: gen5 compiles the compiler ==="
          ./nova_gen5 nova_compiler.nova gen6.ll
          echo "=== Compare gen5 vs gen6 ==="
          if diff -q gen5.ll gen6.ll; then
            echo "::notice title=macOS reconverge::RECONVERGED gen5 == gen6 (byte-identical, 3-pass)"
          else
            # Report the SHAPE of the divergence, not just the first line: a 1-2 line drift that
            # shrank from gen4->gen5 is still-converging, while a large or identical-sized diff is
            # a real determinism bug. Without this the next debugging round is blind.
            D45=$(diff gen4.ll gen5.ll | grep -c '^<' || true)
            D56=$(diff gen5.ll gen6.ll | grep -c '^<' || true)
            echo "::error title=macOS reconverge::DIVERGED after 3 passes. drift gen4->gen5=$D45 lines, gen5->gen6=$D56 lines. First: $(diff gen5.ll gen6.ll | head -4 | paste -sd ' ' -)"
            exit 1
          fi
          rm -f nova_gen4 nova_gen5 gen4.ll gen5.ll gen6.ll
        timeout-minutes: 60

      - name: Run core test suite
        run: |
          cd nova-compiler
          export NOVA_NO_CACHE=1
          export NOVA_HOME="$(pwd)"
          NOVA="compiler/nova"
          RUNTIME="compiler/nova_runtime.c"

          cd test_programs
          PASS=0; FAIL=0; SKIP=0; FAILURES=""

          # PORTABLE KILL-ON-TIMEOUT. `timeout` is GNU coreutils and DOES NOT EXIST on macOS.
          # The macOS run of this step reported 0 PASS / 62 FAIL with EVERY test marked (RUN)
          # for exactly that reason: `timeout: command not found` exits 127, which the loop
          # below read as a run failure. Nothing was wrong with the binaries -- they were never
          # executed at all. Linux stayed green only because coreutils is present there.
          # perl ships on BOTH macOS and Linux and alarm(2) gives the same hard-kill guarantee,
          # so kill-on-timeout still holds and a hung test can never wedge the runner.
          # Linux keeps using coreutils `timeout` (detected first), so its behaviour is unchanged.
          if command -v timeout >/dev/null 2>&1; then
            RUNTMO() { timeout "$@"; }; TMO_KIND="timeout(coreutils)"
          elif command -v gtimeout >/dev/null 2>&1; then
            RUNTMO() { gtimeout "$@"; }; TMO_KIND="gtimeout(brew coreutils)"
          else
            RUNTMO() { perl -e 'alarm shift; exec @ARGV' "$@"; }; TMO_KIND="perl alarm"
          fi
          echo "::notice title=timeout mechanism::$TMO_KIND"

          TESTS=(
            float_test while_test list_test string_test for_test
            closure_test combined_test nested_fn_test
            struct_test struct_advanced_test struct_mutate_test
            match_test match_advanced_test higher_order_test
            enum_test range_test string_methods_test dict_test
            math_test string_stdlib_test list_methods_test
            type_conv_test slice_test defaults_test
            in_operator_test struct_methods_test
            generics_test match_guard_test trait_test
            destructure_test assert_test string_index_test
            string_iter_test string_ops_test
            list_struct_test list_struct_loop_test
            string_accum_test string_accum_fn_test
            codegen_pattern_test match_expr_test
            map_filter_test bitwise_test
            closure_ir_test error_test tiny_test match_str_test
            default_params_test tuple_test method_test
            math_quick_test else_sibling_test
            mini_struct_test mini2_test
            stdlib_test mixed_arith_test
            shadow_test json_float_test nested_float_test
            dict_float_test bool_json_test nested_bool_test
            float_list_ops_test
          )

          for t in "${TESTS[@]}"; do
            nova="${t}.nova"
            ll="${t}.ll"
            exe="${t}"

            if [ ! -f "$nova" ]; then
              SKIP=$((SKIP + 1))
              continue
            fi

            if ! "../${NOVA}" "$nova" > /dev/null 2>&1; then
              echo "FAIL compile: $t"
              FAILURES="$FAILURES $t(COMPILE)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if [ ! -f "$ll" ]; then
              echo "FAIL compile: $t (no .ll)"
              FAILURES="$FAILURES $t(NO_LL)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if ! clang -O2 -o "$exe" "$ll" "../${RUNTIME}" -lm -Wno-everything -D_DARWIN_C_SOURCE 2>/dev/null; then
              echo "FAIL link: $t"
              FAILURES="$FAILURES $t(LINK)"
              FAIL=$((FAIL + 1))
              rm -f "$ll"
              continue
            fi

            if RUNTMO 15 ./"$exe" > /tmp/test_out.txt 2>/tmp/test_err.txt; then
              if grep -q "FAIL assert" /tmp/test_err.txt 2>/dev/null; then
                echo "FAIL assert: $t"
                FAILURES="$FAILURES $t(ASSERT)"
                FAIL=$((FAIL + 1))
              else
                echo "PASS $t"
                PASS=$((PASS + 1))
              fi
            else
              EXIT_CODE=$?
              # 124 = GNU timeout's kill code; 142 = 128+SIGALRM, what the perl alarm fallback
              # yields. Both mean "the test hung", and both must be reported as TIMEOUT rather
              # than misfiled as a run failure.
              if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 142 ]; then
                echo "FAIL timeout: $t"
                FAILURES="$FAILURES $t(TIMEOUT)"
              else
                echo "FAIL run: $t (exit=$EXIT_CODE)"
                FAILURES="$FAILURES $t(RUN)"
              fi
              FAIL=$((FAIL + 1))
            fi

            rm -f "$ll" "$exe"
          done

          echo ""
          echo "=== RESULTS: $PASS PASS, $FAIL FAIL, $SKIP SKIP ==="
          # ANNOTATIONS: the logs endpoint is 403 without a token, so a bare exit 1 tells us
          # nothing about WHICH test failed. This step has never run before (macOS always died
          # earlier), so surface the outcome either way rather than spend a CI round-trip finding out.
          echo "::notice title=macOS core suite::$PASS PASS, $FAIL FAIL, $SKIP SKIP"
          if [ -n "$FAILURES" ]; then
            echo "Failures:$FAILURES"
            echo "::error title=macOS core suite failures::$FAILURES"
          fi
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ─── macOS (Kotlin bootstrap, legacy reference) ───────

  # ─── TIER 2: the FULL suite on POSIX. NON-BLOCKING until it is green. ───────────────
  # The selfhosted jobs above run a hand-listed 60-test core suite, because they never synced
  # forge/ + prism/ into $NOVA_HOME/lib -- so anything doing `import forge...` could not resolve.
  # Windows runs all ~3,590. This job closes that gap and turns "the COMPILER works on three
  # platforms" into "NOVA works on three platforms".
  #
  # continue-on-error: TRUE ON PURPOSE. Linux and macOS are green today; this suite has never run
  # on POSIX, so its first pass will surface real unknowns (macOS took four genuine bugs to go
  # from "never built" to green). Reporting them WITHOUT turning the board red is the point --
  # flip this to blocking once it passes.
  posix-full-suite:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm joins here rather than running its own unsharded pass. It had the whole
        # ~3,570-test suite on ONE runner and hit the 330-minute cap at 3525/3570 -- roughly 200
        # minutes in the parallel phase before it even reached the serial server tests. Sharded
        # four ways it gets the same wall-clock budget as every other platform.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      NOVA_SHARD_INDEX: ${{ matrix.shard }}
      NOVA_SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld

      - name: Build self-hosted compiler from the checked-in seed
        run: |
          cd nova-compiler/compiler
          # Branch on ARCH as well as OS. This used to test only `uname -s`, so an aarch64 Linux
          # runner would have been handed the x86_64 seed -- a triple mismatch that fails at the
          # first instruction selection, with an error naming clang rather than the seed.
          case "$(uname -s)/$(uname -m)" in
            Darwin/*)          SEED=nova_compiler_macos.ll;       LINK="-lm -D_DARWIN_C_SOURCE" ;;
            Linux/aarch64|Linux/arm64) SEED=nova_compiler_linux_arm64.ll; LINK="-lpthread -ldl -lm" ;;
            *)                 SEED=nova_compiler_linux.ll;       LINK="-lpthread -ldl -lm" ;;
          esac
          echo "::notice title=seed::$(uname -s)/$(uname -m) -> $SEED :: $(grep -m1 'target triple' $SEED)"
          # Guard the triple, exactly as the per-platform selfhosted jobs do: a seed emitted for the
          # wrong target is the one failure mode this whole step exists to avoid.
          case "$(uname -s)/$(uname -m)" in
            Darwin/*)                  WANT=aarch64-apple-darwin ;;
            Linux/aarch64|Linux/arm64) WANT=aarch64-unknown-linux-gnu ;;
            *)                         WANT=x86_64-unknown-linux-gnu ;;
          esac
          grep -q "$WANT" "$SEED" || { echo "::error title=seed::$SEED is not $WANT-targeted"; exit 1; }
          clang -O2 -o nova "$SEED" nova_runtime.c $LINK -Wno-everything
          ./nova --version || true

      - name: Run FULL suite
        run: bash .github/scripts/posix_full_suite.sh
        timeout-minutes: 330

  # ─── 5.7: Linux on AArch64. NO HARDWARE NEEDED — the plan's "needs hardware" was wrong. ───
  # GitHub's ubuntu-24.04-arm runners are free for public repos. macOS already proves the
  # aarch64 CODEGEN path (macos-latest is arm64); this proves aarch64 + ELF + glibc, which is a
  # genuinely different combination: different object format, different libc, different syscall
  # ABI. Non-blocking until green, same discipline as the Tier 2 job.
  linux-arm64-selfhosted:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
          echo "::notice title=linux-arm64 runner::arch=$(uname -m) clang=$(clang --version | head -1)"

      - name: Build self-hosted compiler from the aarch64 Linux seed
        run: |
          cd nova-compiler/compiler
          test -f nova_compiler_linux_arm64.ll || { echo "::error::aarch64 bootstrap IR missing"; exit 1; }
          grep -q 'aarch64-unknown-linux-gnu' nova_compiler_linux_arm64.ll \
            || { echo "::error::seed is not aarch64-linux-targeted"; exit 1; }
          clang -O2 -o nova nova_compiler_linux_arm64.ll nova_runtime.c -lpthread -ldl -lm -Wno-everything
          ./nova --version || true

      - name: Native host targeting
        run: |
          cd nova-compiler/compiler
          printf 'fn main()\n    print(os_name())\n' > /tmp/hostprobe.nova
          ./nova compile -o /tmp/hostprobe.ll /tmp/hostprobe.nova
          grep -q 'target triple = "aarch64-unknown-linux-gnu"' /tmp/hostprobe.ll \
            || { echo "::error title=arm64 targeting::did not target aarch64-linux: $(grep '^target ' /tmp/hostprobe.ll)"; exit 1; }
          echo "::notice title=linux-arm64 targeting::OK aarch64-unknown-linux-gnu"

      # The canonical 3-pass, matching CLAUDE.md and the macOS job. The seed is cross-produced by
      # the WINDOWS-hosted compiler, so generation 1 still carries the producing host's behaviour
      # and needs one more pass to wash out -- exactly what caught macOS out at 2 passes.
      - name: Reconverge check (3-pass, gen5 == gen6)
        run: |
          cd nova-compiler/compiler
          export NOVA_NO_CACHE=1
          CC="nova_runtime.c -lpthread -ldl -lm -Wno-everything"
          ./nova nova_compiler.nova gen4.ll && clang -O2 -o nova_gen4 gen4.ll $CC
          ./nova_gen4 nova_compiler.nova gen5.ll && clang -O2 -o nova_gen5 gen5.ll $CC
          ./nova_gen5 nova_compiler.nova gen6.ll
          if diff -q gen5.ll gen6.ll; then
            echo "::notice title=linux-arm64 reconverge::RECONVERGED gen5 == gen6 (byte-identical, 3-pass)"
          else
            D45=$(diff gen4.ll gen5.ll | grep -c '^<' || true); D56=$(diff gen5.ll gen6.ll | grep -c '^<' || true)
            echo "::error title=linux-arm64 reconverge::DIVERGED. drift gen4->gen5=$D45 gen5->gen6=$D56. First: $(diff gen5.ll gen6.ll | head -4 | paste -sd ' ' -)"
            exit 1
          fi
          rm -f nova_gen4 nova_gen5 gen4.ll gen5.ll gen6.ll
        timeout-minutes: 60

      # The full suite moved to the sharded posix-full-suite matrix (see its `os:` list). This job
      # keeps the thing only it can prove: that aarch64+ELF+glibc reaches a byte-identical
      # fixpoint. Leaving an unsharded copy here would just re-time-out and mask that result.

  # ─── TIER 3: NOVA_T8_FULLRC (leak-checking) — currently ZERO CI coverage anywhere ─────
  # The local arc runs BOTH memory modes, but CI has only ever run NORMAL, on any platform.
  # FULLRC exercises a different refcount path and historically catches a different bug class
  # (use-after-free, leaks) that NORMAL cannot see. Separate job rather than a second pass in
  # the existing one, so it runs in PARALLEL instead of doubling that job's wall time.
  windows-fullrc:
    runs-on: windows-latest
    # BLOCKING as of 2026-08-28: passed 3592 PASS / 0 FAIL / 0 SKIP on its FIRST run, so the
    # leak-checking mode is now enforced rather than merely observed. A gate that has proven it
    # can pass and is left non-blocking is not a gate, it is a decoration.
    steps:
      - uses: actions/checkout@v4
      - name: Run full regression (NOVA_T8_FULLRC)
        shell: pwsh
        run: |
          Set-Location nova-compiler/test_programs
          $env:NOVA_T8_FULLRC = "1"
          $env:PGPASSWORD = ""     # same reason as the NORMAL job: the image exports it with the service stopped
          pwsh -NoProfile -File .\_run_final_regression.ps1 2>&1 | Tee-Object -FilePath fullrc.log
          $code = $LASTEXITCODE
          $all = @(Get-Content fullrc.log -ErrorAction SilentlyContinue)
          $summary = @($all | Where-Object { $_ -match 'RESULTS:' }) -join ' '
          if ($summary) { Write-Host "::notice title=Windows FULLRC summary::$summary" }
          $fails = @($all | Where-Object { $_ -match '^(FAIL|TIMEOUT)' } | Select-Object -First 20)
          if ($fails.Count -gt 0) { Write-Host "::error title=Windows FULLRC FAILS::$(($fails -join ' | '))" }
          exit $code
        timeout-minutes: 120
