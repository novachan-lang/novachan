name: cross-platform

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Runtime compiles cleanly on macOS (Apple clang) — proves the
  # platform-independence claim. The runtime is the foundation; if it builds,
  # NOVA programs can run.
  macos-runtime-builds:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          clang --version
          uname -a
      - name: Compile nova_runtime.c
        run: |
          cd nova-compiler/test_programs/output
          clang -O2 -c nova_runtime.c -o nova_runtime.o -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-pointer-sign -D_DARWIN_C_SOURCE
          ls -la nova_runtime.o
      - name: Build minimal C program against runtime
        run: |
          cd nova-compiler/test_programs/output
          cat > _smoke_main.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern int64_t nova_rt_create_string(void* s);
          extern int64_t nova_rt_print(int64_t s);
          int main(void) {
              int64_t s = nova_rt_create_string("macOS runtime smoke test PASS");
              nova_rt_print(s);
              return 0;
          }
          EOF
          clang -O2 _smoke_main.c nova_runtime.c -o smoke_test -Wno-everything -D_DARWIN_C_SOURCE
          ./smoke_test

  linux-runtime-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          clang --version
          uname -a
      - name: Compile nova_runtime.c
        run: |
          cd nova-compiler/test_programs/output
          clang -O2 -c nova_runtime.c -o nova_runtime.o -Wno-everything
          ls -la nova_runtime.o
      - name: Build and run minimal smoke test
        run: |
          cd nova-compiler/test_programs/output
          cat > _smoke_main.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          extern int64_t nova_rt_create_string(void* s);
          extern int64_t nova_rt_print(int64_t s);
          int main(void) {
              int64_t s = nova_rt_create_string("Linux runtime smoke test PASS");
              nova_rt_print(s);
              return 0;
          }
          EOF
          clang -O2 _smoke_main.c nova_runtime.c -o smoke_test -Wno-everything -lpthread -ldl -lm
          ./smoke_test
