name: NOVA Cross-Platform CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# SUPERSEDE, don't queue. Every push spawns a full matrix, and each macOS job runs ~90 minutes
# while the free runner pool serialises them -- so pushing six fixes in a row queued six matrices
# and self-inflicted most of a day of latency waiting on results for code that was already
# obsolete. Only the newest commit on a branch is worth testing, so cancel the older ones.
#
# Scoped per ref so master and a PR never cancel each other. NOT applied to the individual jobs:
# the group must cover the whole run, or one job could be cancelled while its siblings continue
# and the run would report a conclusion drawn from half a matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  # ─── Windows: full 114-test regression + benchmarks ───────────────
  windows-full-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          clang --version
          Write-Host "CPU: $([System.Environment]::ProcessorCount) cores"

      # The step ran bare `_run_final_regression.ps1`, which is the FULL suite (3,590 tests as of
      # 2026-08-27), not the 114 the old label claimed. One mode takes ~25 min on a fast dev box,
      # so a 20-minute cap could never pass -- every run died on the clock, not on a test. The
      # hosted runner has fewer cores than a dev machine, hence 90. GitHub's hard job ceiling is
      # 6 h, so this is still well inside it.
      # DIAGNOSTICS, for the same reason the macOS job has them: the Actions LOGS endpoint is 403
      # without a token, so a bare `exit 1` here is unreadable -- we learn the run failed and
      # nothing whatsoever about which test. ::error::/::notice:: become ANNOTATIONS, which the
      # public API DOES expose. Tee keeps the human-readable log intact while letting us scrape
      # the FAIL lines and the RESULTS summary back out.
      - name: Run full regression suite (all ~3,590 tests, NORMAL mode)
        shell: pwsh
        run: |
          Set-Location nova-compiler/test_programs
          # POSTGRES. GitHub's windows-latest image ships PostgreSQL PREINSTALLED and exports
          # PGUSER/PGPASSWORD, but leaves the SERVICE STOPPED. _kat_pg_replace is written to skip
          # cleanly when PGPASSWORD is empty -- but because the image sets it, the test does NOT
          # skip: it tries to connect to a server that is not running, fails, and exit(1)s.
          # Try to start the bundled service so the PG tests genuinely RUN (a stronger gate than
          # skipping). If it cannot start, clear PGPASSWORD so they take their designed skip path
          # instead of failing on an absent server. Either way the outcome is reported.
          $pgsvc = Get-Service -Name postgresql* -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pgsvc) {
            try { Start-Service $pgsvc.Name -ErrorAction Stop; Start-Sleep -Seconds 5 } catch { }
            $pgsvc.Refresh()
          }
          if ($pgsvc -and $pgsvc.Status -eq 'Running') {
            Write-Host "::notice title=Windows postgres::$($pgsvc.Name) RUNNING -- PG tests will execute for real"
          } else {
            $env:PGPASSWORD = ""
            Write-Host "::notice title=Windows postgres::no running PG service; PGPASSWORD cleared so PG tests take their designed skip path"
          }
          # MUST be a CHILD PROCESS, not `& .\script.ps1`. _run_final_regression.ps1 ends with
          # `exit 1`, and in PowerShell an `exit` inside a script invoked with `&` tears down the
          # CALLING script as well -- so the annotation code below never ran and the first attempt
          # at diagnostics produced nothing at all. A separate pwsh process cannot do that, and
          # $LASTEXITCODE still carries its status.
          pwsh -NoProfile -File .\\_run_final_regression.ps1 2>&1 | Tee-Object -FilePath regression.log
          $code = $LASTEXITCODE
          $all = @(Get-Content regression.log -ErrorAction SilentlyContinue)
          $summary = @($all | Where-Object { $_ -match 'RESULTS:' }) -join ' '
          if ($summary) { Write-Host "::notice title=Windows regression summary::$summary" }
          # WARN lines matter as much as FAIL ones: a failed sqlite/runtime PRE-COMPILE is only
          # a WARN, yet it makes every dependent test fail downstream with a misleading error.
          # Scraping only ^FAIL hid exactly that.
          $warns = @($all | Where-Object { $_ -match '^(WARN|sqlite3_test\.o|Pre-compiling)' } | Select-Object -First 6)
          if ($warns.Count -gt 0) { Write-Host "::notice title=Windows regression setup::$(($warns -join ' | '))" }
          $fails = @($all | Where-Object { $_ -match '^(FAIL|TIMEOUT)' } | Select-Object -First 20)
          if ($fails.Count -gt 0) {
            Write-Host "::error title=Windows regression FAILS ($($fails.Count) shown)::$(($fails -join ' | '))"
          } elseif ($code -ne 0) {
            # ONLY meaningful when the run actually failed. This branch used to fire on SUCCESS
            # too, so a clean 3592 PASS / 0 FAIL was reported as "suite likely died early" --
            # a false alarm that would teach a future reader to distrust a genuine green.
            Write-Host "::error title=Windows regression::exit=$code but no FAIL line matched -- the suite died before reporting; see the setup notice above"
          }
          exit $code
        timeout-minutes: 90

      - name: Run benchmark suite
        shell: pwsh
        run: |
          if (Test-Path "bench/run_bench.ps1") {
            Set-Location bench
            & .\\run_bench.ps1
          } else {
            Write-Host "No bench suite found, skipping"
          }
        timeout-minutes: 10

  # ─── Linux: self-hosted compiler (the LIVE compiler, not Kotlin) ───
  linux-selfhosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
          clang --version

      # nova_compiler_linux.ll is the checked-in BOOTSTRAP SEED: the compiler's own IR, emitted
      # with --target linux so it carries the ELF datalayout (e-m:e) rather than the Windows one.
      # This is the chicken-and-egg break -- you need a NOVA compiler to build the NOVA compiler,
      # so one generation ships as IR. Regenerate with:
      #     nova compile --target linux -o nova_compiler_linux.ll nova_compiler.nova
      - name: Build self-hosted compiler from checked-in Linux bootstrap IR
        run: |
          cd nova-compiler/compiler
          test -f nova_compiler_linux.ll || { echo "bootstrap IR missing"; exit 1; }
          grep -q 'x86_64-unknown-linux-gnu' nova_compiler_linux.ll || { echo "bootstrap IR is not Linux-targeted"; exit 1; }
          clang -O2 -o nova nova_compiler_linux.ll nova_runtime.c -lpthread -ldl -lm -Wno-everything
          echo "Built native Linux compiler:"
          ls -la nova
          ./nova --version

      # A native host must pick its OWN triple. Before native_target_triple() landed,
      # resolve_target("") was hardcoded to Windows, so a Linux build silently emitted
      # x86_64-pc-windows-msvc. Assert the compiler self-identifies as Linux.
      - name: Native host targeting
        run: |
          cd nova-compiler/compiler
          printf 'fn main()\n    print(os_name())\n' > /tmp/hostprobe.nova
          ./nova compile -o /tmp/hostprobe.ll /tmp/hostprobe.nova
          grep -q 'target triple = "x86_64-unknown-linux-gnu"' /tmp/hostprobe.ll \
            || { echo "FAIL: native build did not target Linux"; grep '^target ' /tmp/hostprobe.ll; exit 1; }
          echo "OK: native host targeting resolves to Linux"

      - name: Reconverge check (3-pass, gen5 == gen6)
        run: |
          cd nova-compiler/compiler
          export NOVA_NO_CACHE=1
          # NOTE: bare `-o` is NOT a top-level flag -- `nova <in.nova> <out.ll>` is positional.
          # (`nova compile -o <out> <in>` is the flag form, used in the probe step above.)
          #
          # THREE PASSES, not two. This job compared the SEED's output against the seed-built
          # compiler's output, which are one generation apart -- so it diverged for ANY change to
          # codegen, reporting "the compiler is broken" when the compiler was fine and the
          # comparison was wrong. It only ever passed because emission happened not to change.
          # macos-selfhosted and linux-arm64-selfhosted were already fixed to 3 passes; this one
          # was missed, and linux-arm64 passing the same commit that failed here is the proof.
          #
          # The fixpoint claim needs gen5 and gen6 to be emitted by compilers that BOTH implement
          # the current source: seed -> gen4 (emitted by the seed) -> gen5 (emitted by gen4) ->
          # gen6 (emitted by gen5). gen4 is the throwaway that absorbs the emitter change.
          echo "=== gen4: seed compiles the compiler ==="
          ./nova nova_compiler.nova gen4.ll
          clang -O2 -o nova_gen4 gen4.ll nova_runtime.c -lpthread -ldl -lm -Wno-everything
          echo "=== gen5: gen4 compiles the compiler ==="
          ./nova_gen4 nova_compiler.nova gen5.ll
          clang -O2 -o nova_gen5 gen5.ll nova_runtime.c -lpthread -ldl -lm -Wno-everything
          echo "=== gen6: gen5 compiles the compiler ==="
          ./nova_gen5 nova_compiler.nova gen6.ll
          echo "=== Compare gen5 vs gen6 ==="
          if diff -q gen5.ll gen6.ll; then
            echo "RECONVERGED: gen5 == gen6 (byte-identical, 3-pass)"
            echo "::notice title=linux reconverge::RECONVERGED gen5 == gen6 (byte-identical, 3-pass)"
          else
            D45=$(diff gen4.ll gen5.ll | grep -c '^<' || true); D56=$(diff gen5.ll gen6.ll | grep -c '^<' || true)
            # Report the SHAPE: drift that shrinks to zero means one more pass was needed;
            # drift that stays constant means non-determinism. That distinction is the diagnosis.
            echo "::error title=linux reconverge::DIVERGED. drift gen4->gen5=$D45 gen5->gen6=$D56. First: $(diff gen5.ll gen6.ll | head -4 | paste -sd ' ' -)"
            diff gen5.ll gen6.ll | head -40
            exit 1
          fi
          rm -f nova_gen4 nova_gen5 gen4.ll gen5.ll gen6.ll
        timeout-minutes: 30

      - name: Run core test suite
        run: |
          cd nova-compiler
          export NOVA_NO_CACHE=1
          export NOVA_HOME="$(pwd)"
          NOVA="compiler/nova"
          RUNTIME="compiler/nova_runtime.c"

          cd test_programs
          PASS=0; FAIL=0; SKIP=0; FAILURES=""

          # PORTABLE KILL-ON-TIMEOUT. `timeout` is GNU coreutils and DOES NOT EXIST on macOS.
          # The macOS run of this step reported 0 PASS / 62 FAIL with EVERY test marked (RUN)
          # for exactly that reason: `timeout: command not found` exits 127, which the loop
          # below read as a run failure. Nothing was wrong with the binaries -- they were never
          # executed at all. Linux stayed green only because coreutils is present there.
          # perl ships on BOTH macOS and Linux and alarm(2) gives the same hard-kill guarantee,
          # so kill-on-timeout still holds and a hung test can never wedge the runner.
          # Linux keeps using coreutils `timeout` (detected first), so its behaviour is unchanged.
          if command -v timeout >/dev/null 2>&1; then
            RUNTMO() { timeout "$@"; }; TMO_KIND="timeout(coreutils)"
          elif command -v gtimeout >/dev/null 2>&1; then
            RUNTMO() { gtimeout "$@"; }; TMO_KIND="gtimeout(brew coreutils)"
          else
            RUNTMO() { perl -e 'alarm shift; exec @ARGV' "$@"; }; TMO_KIND="perl alarm"
          fi
          echo "::notice title=timeout mechanism::$TMO_KIND"

          TESTS=(
            float_test while_test list_test string_test for_test
            closure_test combined_test nested_fn_test
            struct_test struct_advanced_test struct_mutate_test
            match_test match_advanced_test higher_order_test
            enum_test range_test string_methods_test dict_test
            math_test string_stdlib_test list_methods_test
            type_conv_test slice_test defaults_test
            in_operator_test struct_methods_test
            generics_test match_guard_test trait_test
            destructure_test assert_test string_index_test
            string_iter_test string_ops_test
            list_struct_test list_struct_loop_test
            string_accum_test string_accum_fn_test
            codegen_pattern_test match_expr_test
            map_filter_test bitwise_test
            closure_ir_test error_test tiny_test match_str_test
            default_params_test tuple_test method_test
            math_quick_test else_sibling_test
            mini_struct_test mini2_test
            stdlib_test mixed_arith_test
            shadow_test json_float_test nested_float_test
            dict_float_test bool_json_test nested_bool_test
            float_list_ops_test
          )

          for t in "${TESTS[@]}"; do
            nova="${t}.nova"
            ll="${t}.ll"
            exe="${t}"

            if [ ! -f "$nova" ]; then
              SKIP=$((SKIP + 1))
              continue
            fi

            if ! "../${NOVA}" "$nova" > /dev/null 2>&1; then
              echo "FAIL compile: $t"
              FAILURES="$FAILURES $t(COMPILE)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if [ ! -f "$ll" ]; then
              echo "FAIL compile: $t (no .ll)"
              FAILURES="$FAILURES $t(NO_LL)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if ! clang -O2 -o "$exe" "$ll" "../${RUNTIME}" -lpthread -ldl -lm -Wno-everything 2>/dev/null; then
              echo "FAIL link: $t"
              FAILURES="$FAILURES $t(LINK)"
              FAIL=$((FAIL + 1))
              rm -f "$ll"
              continue
            fi

            if RUNTMO 15 ./"$exe" > /tmp/test_out.txt 2>/tmp/test_err.txt; then
              if grep -q "FAIL assert" /tmp/test_err.txt 2>/dev/null; then
                echo "FAIL assert: $t"
                FAILURES="$FAILURES $t(ASSERT)"
                FAIL=$((FAIL + 1))
              else
                echo "PASS $t"
                PASS=$((PASS + 1))
              fi
            else
              EXIT_CODE=$?
              # 124 = GNU timeout's kill code; 142 = 128+SIGALRM, what the perl alarm fallback
              # yields. Both mean "the test hung", and both must be reported as TIMEOUT rather
              # than misfiled as a run failure.
              if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 142 ]; then
                echo "FAIL timeout: $t"
                FAILURES="$FAILURES $t(TIMEOUT)"
              else
                echo "FAIL run: $t (exit=$EXIT_CODE)"
                FAILURES="$FAILURES $t(RUN)"
              fi
              FAIL=$((FAIL + 1))
            fi

            rm -f "$ll" "$exe"
          done

          echo ""
          echo "=== RESULTS: $PASS PASS, $FAIL FAIL, $SKIP SKIP ==="
          if [ -n "$FAILURES" ]; then
            echo "Failures:$FAILURES"
          fi
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ─── Linux (Kotlin bootstrap, legacy reference) ───────
      # Undefined behaviour is a SOURCE property, not a platform one -- so one instrumented run
      # here protects Windows, Linux and macOS alike. See .github/scripts/ubsan_gate.sh for the
      # argon2id story that made this necessary: three sanitizers reported clean while the code
      # was computing on signed overflow, and only UBSan could see it.
      - name: UBSan gate (undefined behaviour fails the build)
        run: bash .github/scripts/ubsan_gate.sh
        timeout-minutes: 30

  macos-selfhosted:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify clang
        run: clang --version

      - name: Build self-hosted compiler from checked-in IR
        run: |
          cd nova-compiler/compiler
          # macOS: no -lpthread -ldl needed (part of system libs)
          # nova_compiler_macos.ll is the checked-in BOOTSTRAP SEED, the exact mirror of
          # nova_compiler_linux.ll. Regenerate BOTH from the same commit with:
          #     nova compile --target macos-arm64 -o nova_compiler_macos.ll nova_compiler.nova
          #     nova compile --target linux      -o nova_compiler_linux.ll nova_compiler.nova
          # This job used to build from `nova_compiler.ll`, which is NOT tracked in git, so it
          # failed at `clang: no such file` on every run and macOS was never actually tested.
          # DIAGNOSTICS FIRST. This job failed twice and the Actions logs endpoint returns 403
          # without a token, so the only way to see the cause is to have the job print it.
          # The prime suspect is an arch mismatch: the seed is aarch64-apple-darwin because
          # macos-latest is documented as ARM64, and if this runner is actually x86_64 then clang
          # rejects the module outright. `uname -m` settles it in one line.
          # ::notice:: / ::error:: become ANNOTATIONS, which the REST API exposes WITHOUT a
          # token -- unlike the logs endpoint, which is 403 on a public repo. That is the only
          # channel that gets a diagnostic off this runner and back to a developer who cannot
          # read the logs. Plain `echo` goes only to the log body and is invisible to us.
          echo "::notice title=macOS runner::arch=$(uname -m) clang=$(clang --version | head -1)"
          test -f nova_compiler_macos.ll || { echo 'macOS bootstrap IR missing'; exit 1; }
          echo "::notice title=macOS seed::$(grep -m1 'target triple' nova_compiler_macos.ll)"
          # Guard the triple, exactly as the Linux job does: a seed emitted for the wrong target
          # still compiles far enough to waste the whole run before failing confusingly.
          # macos-latest runners are ARM64, hence aarch64-apple-darwin.
          grep -q 'aarch64-apple-darwin' nova_compiler_macos.ll || { echo 'bootstrap IR is not arm64-macOS-targeted'; exit 1; }
          # 2>&1 | tail so the actual clang diagnostic reaches the job summary even when the
          # log body is unreadable. `set -o pipefail` keeps the step failing on clang's status
          # rather than on tail's success -- without it a broken build reports as green.
          # Capture clang, then re-emit the tail as an ANNOTATION so the real error is readable
          # without log access. pipefail is still required: without it a failing clang would
          # report GREEN because tee succeeded.
          set -o pipefail
          if ! clang -O2 -o nova nova_compiler_macos.ll nova_runtime.c -lm -Wno-everything -D_DARWIN_C_SOURCE 2>&1 | tee /tmp/clang.log; then
            echo "::error title=macOS clang failed::$(tail -c 700 /tmp/clang.log | paste -sd ' ' -)"
            exit 1
          fi
          echo "Built native macOS compiler:"
          ls -la nova
          ./nova --version || true

      # A native host must pick its OWN triple, exactly as the Linux job asserts. Without this a
      # macOS build that silently emitted the Windows triple would still pass the test suite by
      # running through Rosetta-ish luck, and we would not learn until someone shipped.
      - name: Native host targeting
        run: |
          cd nova-compiler/compiler
          printf 'fn main()\n    print(os_name())\n' > /tmp/hostprobe.nova
          ./nova compile -o /tmp/hostprobe.ll /tmp/hostprobe.nova
          grep -q 'target triple = "aarch64-apple-darwin' /tmp/hostprobe.ll \
            || { echo "::error title=macOS targeting::native build did not target arm64-macOS: $(grep '^target ' /tmp/hostprobe.ll)"; exit 1; }
          echo "::notice title=macOS targeting::OK, native host resolves to aarch64-apple-darwin"

      # THE strongest test that exists for a self-hosting compiler: it must compile ITSELF to a
      # byte-identical fixpoint on this OS. Linux has had this; macOS never did, so "macOS works"
      # rested only on ~60 core tests. Mirrors the Linux step exactly.
      # CANONICAL 3-PASS reconverge, matching CLAUDE.md and the Windows arc:
      #   seed -> gen4 -> gen5 -> gen6, then compare gen5 == gen6.
      # This step previously did only TWO generations (seed -> gen5 -> gen6). Linux happens to
      # converge in two, but that is luck, not a guarantee: the seed is cross-produced by the
      # WINDOWS-hosted compiler, so generation 1 still carries the producing host's behaviour and
      # needs one more pass to wash out. macOS diverged on exactly that -- a struct managed-slot
      # bitmap differing in two bits -- which is a one-generation-short signature, not a codegen bug.
      - name: Reconverge check (3-pass, gen5 == gen6)
        run: |
          cd nova-compiler/compiler
          export NOVA_NO_CACHE=1
          CC_ARGS="nova_runtime.c -lm -Wno-everything -D_DARWIN_C_SOURCE"
          echo "=== gen4: seed compiles the compiler ==="
          ./nova nova_compiler.nova gen4.ll
          clang -O2 -o nova_gen4 gen4.ll $CC_ARGS
          echo "=== gen5: gen4 compiles the compiler ==="
          ./nova_gen4 nova_compiler.nova gen5.ll
          clang -O2 -o nova_gen5 gen5.ll $CC_ARGS
          echo "=== gen6: gen5 compiles the compiler ==="
          ./nova_gen5 nova_compiler.nova gen6.ll
          echo "=== Compare gen5 vs gen6 ==="
          if diff -q gen5.ll gen6.ll; then
            echo "::notice title=macOS reconverge::RECONVERGED gen5 == gen6 (byte-identical, 3-pass)"
          else
            # Report the SHAPE of the divergence, not just the first line: a 1-2 line drift that
            # shrank from gen4->gen5 is still-converging, while a large or identical-sized diff is
            # a real determinism bug. Without this the next debugging round is blind.
            D45=$(diff gen4.ll gen5.ll | grep -c '^<' || true)
            D56=$(diff gen5.ll gen6.ll | grep -c '^<' || true)
            echo "::error title=macOS reconverge::DIVERGED after 3 passes. drift gen4->gen5=$D45 lines, gen5->gen6=$D56 lines. First: $(diff gen5.ll gen6.ll | head -4 | paste -sd ' ' -)"
            exit 1
          fi
          rm -f nova_gen4 nova_gen5 gen4.ll gen5.ll gen6.ll
        timeout-minutes: 60

      - name: Run core test suite
        run: |
          cd nova-compiler
          export NOVA_NO_CACHE=1
          export NOVA_HOME="$(pwd)"
          NOVA="compiler/nova"
          RUNTIME="compiler/nova_runtime.c"

          cd test_programs
          PASS=0; FAIL=0; SKIP=0; FAILURES=""

          # PORTABLE KILL-ON-TIMEOUT. `timeout` is GNU coreutils and DOES NOT EXIST on macOS.
          # The macOS run of this step reported 0 PASS / 62 FAIL with EVERY test marked (RUN)
          # for exactly that reason: `timeout: command not found` exits 127, which the loop
          # below read as a run failure. Nothing was wrong with the binaries -- they were never
          # executed at all. Linux stayed green only because coreutils is present there.
          # perl ships on BOTH macOS and Linux and alarm(2) gives the same hard-kill guarantee,
          # so kill-on-timeout still holds and a hung test can never wedge the runner.
          # Linux keeps using coreutils `timeout` (detected first), so its behaviour is unchanged.
          if command -v timeout >/dev/null 2>&1; then
            RUNTMO() { timeout "$@"; }; TMO_KIND="timeout(coreutils)"
          elif command -v gtimeout >/dev/null 2>&1; then
            RUNTMO() { gtimeout "$@"; }; TMO_KIND="gtimeout(brew coreutils)"
          else
            RUNTMO() { perl -e 'alarm shift; exec @ARGV' "$@"; }; TMO_KIND="perl alarm"
          fi
          echo "::notice title=timeout mechanism::$TMO_KIND"

          TESTS=(
            float_test while_test list_test string_test for_test
            closure_test combined_test nested_fn_test
            struct_test struct_advanced_test struct_mutate_test
            match_test match_advanced_test higher_order_test
            enum_test range_test string_methods_test dict_test
            math_test string_stdlib_test list_methods_test
            type_conv_test slice_test defaults_test
            in_operator_test struct_methods_test
            generics_test match_guard_test trait_test
            destructure_test assert_test string_index_test
            string_iter_test string_ops_test
            list_struct_test list_struct_loop_test
            string_accum_test string_accum_fn_test
            codegen_pattern_test match_expr_test
            map_filter_test bitwise_test
            closure_ir_test error_test tiny_test match_str_test
            default_params_test tuple_test method_test
            math_quick_test else_sibling_test
            mini_struct_test mini2_test
            stdlib_test mixed_arith_test
            shadow_test json_float_test nested_float_test
            dict_float_test bool_json_test nested_bool_test
            float_list_ops_test
          )

          for t in "${TESTS[@]}"; do
            nova="${t}.nova"
            ll="${t}.ll"
            exe="${t}"

            if [ ! -f "$nova" ]; then
              SKIP=$((SKIP + 1))
              continue
            fi

            if ! "../${NOVA}" "$nova" > /dev/null 2>&1; then
              echo "FAIL compile: $t"
              FAILURES="$FAILURES $t(COMPILE)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if [ ! -f "$ll" ]; then
              echo "FAIL compile: $t (no .ll)"
              FAILURES="$FAILURES $t(NO_LL)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if ! clang -O2 -o "$exe" "$ll" "../${RUNTIME}" -lm -Wno-everything -D_DARWIN_C_SOURCE 2>/dev/null; then
              echo "FAIL link: $t"
              FAILURES="$FAILURES $t(LINK)"
              FAIL=$((FAIL + 1))
              rm -f "$ll"
              continue
            fi

            if RUNTMO 15 ./"$exe" > /tmp/test_out.txt 2>/tmp/test_err.txt; then
              if grep -q "FAIL assert" /tmp/test_err.txt 2>/dev/null; then
                echo "FAIL assert: $t"
                FAILURES="$FAILURES $t(ASSERT)"
                FAIL=$((FAIL + 1))
              else
                echo "PASS $t"
                PASS=$((PASS + 1))
              fi
            else
              EXIT_CODE=$?
              # 124 = GNU timeout's kill code; 142 = 128+SIGALRM, what the perl alarm fallback
              # yields. Both mean "the test hung", and both must be reported as TIMEOUT rather
              # than misfiled as a run failure.
              if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 142 ]; then
                echo "FAIL timeout: $t"
                FAILURES="$FAILURES $t(TIMEOUT)"
              else
                echo "FAIL run: $t (exit=$EXIT_CODE)"
                FAILURES="$FAILURES $t(RUN)"
              fi
              FAIL=$((FAIL + 1))
            fi

            rm -f "$ll" "$exe"
          done

          echo ""
          echo "=== RESULTS: $PASS PASS, $FAIL FAIL, $SKIP SKIP ==="
          # ANNOTATIONS: the logs endpoint is 403 without a token, so a bare exit 1 tells us
          # nothing about WHICH test failed. This step has never run before (macOS always died
          # earlier), so surface the outcome either way rather than spend a CI round-trip finding out.
          echo "::notice title=macOS core suite::$PASS PASS, $FAIL FAIL, $SKIP SKIP"
          if [ -n "$FAILURES" ]; then
            echo "Failures:$FAILURES"
            echo "::error title=macOS core suite failures::$FAILURES"
          fi
          if [ $FAIL -gt 0 ]; then exit 1; fi

      # ─── ASAN probe for the LAST macOS failure ─────────────────────────────────────────────
      # _argon2id_kat produces DIFFERENT OUTPUT FROM IDENTICAL INPUT on macOS -- single-threaded,
      # single lane, pure computation -- and does it intermittently. That is memory corruption or
      # an uninitialised read, and the failure gives us nothing to work with: `RUN(1)` and a one
      # line message.
      #
      # It is not reproducible anywhere I can debug: 10/10 clean on Linux, and a full
      # AddressSanitizer build on Linux reports NOTHING. So the only instrument that can see it is
      # ASAN on Darwin itself, which is what this step is. It turns "wrong answer, somewhere" into
      # a precise bad-read/bad-write with a backtrace.
      #
      # DIAGNOSTIC ONLY -- it always exits 0. This job is BLOCKING and currently green; a probe for
      # a known-open bug must never be able to turn the board red, or it stops being information
      # and starts being noise. The findings come out as ::error annotations because Actions logs
      # are 403 without a token, so anything that only reaches the log is invisible.
      # Report WHERE the arena actually landed. The Darwin high-placement goes through
      # mach_vm_allocate behind a __has_include(<mach/mach_vm.h>) guard; if that header is absent
      # the code silently falls back to the advisory mmap hint -- which is precisely the failure
      # that made an earlier "move the arena high" fix inert on macOS while looking applied.
      # Measuring it is the whole point: I already made the mistake of assuming once.
      - name: Verify arena placement (diagnostic, never fails the job)
        run: |
          cd nova-compiler/compiler
          set +e
          cat > /tmp/arena_probe.c <<'PROBE'
          #include "nova_runtime.c"
          int main(void) {
              nova_oa_reserve();
              unsigned long long b = (unsigned long long)g_oa_region_base;
              const unsigned long long SAFE = 0x0000100000000000ULL;
              printf("%llu %s\n", b, b >= SAFE ? "HIGH" : "LOW");
              return 0;
          }
          PROBE
          clang -O1 -I. -o /tmp/arena_probe /tmp/arena_probe.c -lm -D_DARWIN_C_SOURCE -w >/tmp/ap.log 2>&1
          if [ ! -x /tmp/arena_probe ]; then
            echo "::warning title=arena::probe did not build :: $(head -3 /tmp/ap.log | tr '\n' ' ' | cut -c1-300)"; exit 0
          fi
          OUT=$(/tmp/arena_probe 2>&1)
          case "$OUT" in
            *HIGH*) echo "::notice title=arena::macOS arena base $OUT -- above the range programs compute in" ;;
            *LOW*)  echo "::error title=arena::macOS arena base $OUT -- the high placement did NOT take effect (mach_vm.h likely absent), so integer/pointer collisions remain possible" ;;
            *)      echo "::warning title=arena::unexpected probe output: $OUT" ;;
          esac
          exit 0
        timeout-minutes: 15

      - name: ASAN probe -- _argon2id_kat (diagnostic, never fails the job)
        run: |
          cd nova-compiler
          export NOVA_HOME="$(pwd)"
          export NOVA_NO_CACHE=1
          cd test_programs
          set +e
          # Positional form, matching the core-suite step above -- that invocation is proven to
          # work in this job, and a probe that silently skips because of an argument-form quirk
          # would be worse than no probe.
          ../compiler/nova _argon2id_kat.nova /tmp/argon.ll >/tmp/argon_c.log 2>&1
          if [ ! -f /tmp/argon.ll ]; then
            echo "::notice title=asan-argon2id::compile failed; skipping probe"; exit 0
          fi
          clang -O1 -g -fsanitize=address -o /tmp/argon_asan /tmp/argon.ll \
                ../compiler/nova_runtime.c -lm -D_DARWIN_C_SOURCE -w >/tmp/argon_l.log 2>&1
          if [ ! -x /tmp/argon_asan ]; then
            echo "::notice title=asan-argon2id::ASAN link failed; skipping probe"; exit 0
          fi
          # NO `timeout` HERE. macOS ships neither GNU timeout nor gtimeout -- the suite already
          # carries a perl-alarm fallback for exactly this, and the "timeout mechanism" notice in
          # this same job says so. My first version of this probe used `timeout` anyway and every
          # run died with rc=127 (command not found), so it never executed the test at all and
          # reported a non-finding that meant nothing. The step's own timeout-minutes is the
          # backstop; the test takes ~40s, so no inner timeout is needed.
          #
          # Run it several times: the bug is INTERMITTENT, so a single clean run proves nothing.
          for i in 1 2 3 4 5; do
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=0 /tmp/argon_asan >/tmp/argon_r.log 2>&1
            rc=$?
            if grep -q "AddressSanitizer" /tmp/argon_r.log; then
              echo "::error title=asan-argon2id::FINDING on run $i :: $(grep -E 'ERROR: AddressSanitizer|READ of|WRITE of|SUMMARY' /tmp/argon_r.log | head -3 | tr '\n' ' ' | cut -c1-400)"
              echo "::error title=asan-argon2id frames::$(grep -E '^ *#[0-9]' /tmp/argon_r.log | head -8 | tr '\n' ' ' | cut -c1-600)"
              exit 0
            fi
            if [ $rc -ne 0 ] || grep -q "^FAIL" /tmp/argon_r.log; then
              # Report the ACTUAL output, head and tail. The previous version grepped only for
              # ^FAIL/^ok, so when the binary failed to launch it printed an empty reason -- a
              # diagnostic that hid the one fact that mattered.
              echo "::error title=asan-argon2id::run $i FAILED under ASAN, no sanitizer finding (rc=$rc) :: HEAD $(head -3 /tmp/argon_r.log | tr '\n' ' ' | cut -c1-250) :: TAIL $(tail -3 /tmp/argon_r.log | tr '\n' ' ' | cut -c1-250)"
              exit 0
            fi
          done
          echo "::notice title=asan-argon2id::5/5 clean under ASAN -- the fault does not reproduce with the sanitizer's allocator, so try -fsanitize=memory or undefined next"
          exit 0
        timeout-minutes: 45

      # Taking the ASAN probe's own advice, above: it concluded "try -fsanitize=undefined next".
      #
      # WHY ON DARWIN SPECIFICALLY, when ubsan_gate.sh already runs on the Linux job. Undefined
      # behaviour is a property of the SOURCE, but WHICH undefined site a program actually
      # EXECUTES depends on how the compiler optimised it -- and Apple clang and Ubuntu clang
      # optimise differently. That is not hypothetical here: the original argon2id bug was signed
      # overflow in nova_rt_add, and the two compilers computed DIFFERENT ANSWERS from it. So a
      # green UBSan on Ubuntu does not prove a green UBSan on Darwin.
      #
      # _argon2id_test failed on macos-latest shard 0 of run 0017d807 while passing on Linux
      # (verified locally: clean AND under MALLOC_PERTURB_, 168ms, output identical -- so it is
      # neither a use-after-free nor a timeout). This step exists to say whether that failure has
      # a UB cause or was intermittent.
      #
      # DIAGNOSTIC, never fails the job: Apple clang's UBSan may flag pre-existing sites in system
      # headers that have nothing to do with us. Promote it to blocking once it has run clean once,
      # exactly as every other gate in this file was promoted.
      # THE INTERMITTENT macOS FAILURES. macos-latest fails ~1 test out of 892 per run, a DIFFERENT
      # test each time, clustered in crypto: _argon2id_test, forge_jwt_test, forge_pg_scram_test.
      # Already eliminated WITH EVIDENCE, so do not re-run these theories:
      #   * undefined behaviour  -- UBSan under APPLE clang is clean (step below)
      #   * memory corruption    -- ASAN finds nothing while the failure still reproduces
      #   * the fiber switch     -- AAPCS64 set is complete (x19-x28, x29/x30, d8-d15, 160B aligned)
      #   * 16KB Apple pages     -- fiber stack is 1MB + 64KB guard, both multiples of 16384
      #   * __thread vs fiber    -- audited; the stack-floor lesson is applied everywhere
      #   * a Linux-reproducible bug -- both tests pass 5/5 clean AND 5/5 under MALLOC_PERTURB_
      #
      # THE ONE HARD FACT, and what this step chases: forge_jwt_test printed a 43-character string
      # LITERAL as 24 characters ("SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c" -> truncated at
      # "...QT4fwpMeJ"). That is STRING CORRUPTION, not a wrong HMAC -- and every sanitizer run so
      # far has been pointed at _argon2id_kat, never at the tests that actually fail.
      #
      # Two things measured here: the RATE (10 runs each, so "intermittent" becomes a number), and
      # whether ASAN sees anything when pointed at the RIGHT test.
      - name: Intermittent-failure probe -- jwt/scram, rate + ASAN (diagnostic, never fails)
        continue-on-error: true
        run: |
          cd nova-compiler
          export NOVA_HOME="$(pwd)" NOVA_NO_CACHE=1
          # THE LIB SYNC IS NOT OPTIONAL HERE. The first version of this probe reported
          # "forge_jwt_test did not compile" for both tests, because THIS job runs the hand-listed
          # 60-test core suite and never syncs forge/ + prism/ into $NOVA_HOME/lib -- so every
          # `import forge...` fails to resolve. That is the exact limitation the posix-full-suite
          # job was created to fix, and it is stated at the top of that job. A probe placed in a
          # job that structurally cannot build its subject reports nothing and looks like a clean
          # result. Mirror what posix_full_suite.sh does.
          mkdir -p "$NOVA_HOME/lib"
          cp -f ../forge/*.nova "$NOVA_HOME/lib/" 2>/dev/null || true
          find ../prism -name '*.nova' -exec cp -f {} "$NOVA_HOME/lib/" \; 2>/dev/null || true
          if [ -d ../std ]; then
            ( cd ../std && find . -name '*.nova' -print0 \
                | while IFS= read -r -d '' f; do
                    mkdir -p "$NOVA_HOME/std/$(dirname "$f")"; cp -f "$f" "$NOVA_HOME/std/$f"
                  done ) 2>/dev/null || true
          fi
          echo "::notice title=flaky-probe-setup::lib modules $(ls "$NOVA_HOME"/lib/*.nova 2>/dev/null | wc -l | tr -d ' ')"
          # Same OpenSSL detection posix_full_suite.sh performs: forge_* tests link against it,
          # and building them WITHOUT it is a different program from the one that failed.
          PCF=""; PLF="-lm"
          if command -v brew >/dev/null 2>&1 && SSLP="$(brew --prefix openssl@3 2>/dev/null)" && [ -d "$SSLP" ]; then
            PCF="-DNOVA_HAVE_OPENSSL -I$SSLP/include"; PLF="-lm -L$SSLP/lib -lssl -lcrypto"
          fi
          echo "::notice title=flaky-probe-setup::ssl flags [$PCF]"
          cd test_programs
          set +e
          TOTALF=0
          for t in forge_jwt_test forge_pg_scram_test _argon2id_test; do
            [ -f "$t.nova" ] || { echo "::notice title=flaky-probe::$t absent"; continue; }
            rm -f "/tmp/$t.ll"
            ../compiler/nova "$t.nova" "/tmp/$t.ll" >/dev/null 2>&1
            [ -f "/tmp/$t.ll" ] || { echo "::notice title=flaky-probe::$t did not compile"; continue; }
            clang -O1 $PCF -o "/tmp/$t.bin" "/tmp/$t.ll" ../compiler/nova_runtime.c $PLF -w 2>/dev/null
            if [ -x "/tmp/$t.bin" ]; then
              f=0; first=""
              for i in $(seq 1 60); do
                out=$("/tmp/$t.bin" 2>&1); rc=$?
                if [ $rc -ne 0 ]; then f=$((f+1)); [ -z "$first" ] && first=$(printf '%s' "$out" | grep -m1 -iE 'mismatch|assert|error' | tr '\n' ' ' | cut -c1-240); fi
              done
              echo "::notice title=flaky-rate::$t plain: $f/60 FAILED ${first:+:: $first}"
              # BISECT THE CAUSE, not just the rate. forge_pg_scram_test is PURE DETERMINISTIC
              # crypto -- fixed inputs, fixed expected outputs, no network, no randomness -- so a
              # 48% failure means the SAME INPUT PRODUCES DIFFERENT OUTPUT. It is also PBKDF2 with
              # 4096 iterations (~8k SHA-256 calls): a long compute loop, which is exactly where
              # 4.3 inserts preemption safepoints and where a fiber can be switched mid-computation.
              # If the failures vanish at NOVA_CARRIERS=1 the cause is the M:N scheduler and the
              # search space collapses; if they persist, the scheduler is exonerated. Either answer
              # is worth far more than another theory.
              # NOTE: no `timeout` here. It is GNU coreutils and DOES NOT EXIST on macOS -- the
              # first version wrapped these runs in it, every invocation exited 127 (command not
              # found), and the bisect read exactly 30/30 at BOTH carrier counts. It was measuring
              # the absence of /usr/bin/timeout, not the scheduler, and I nearly concluded from it
              # that concurrency was exonerated. Fourth instrument this session that reported
              # confidently while measuring nothing.
              f1=0
              for i in $(seq 1 30); do
                NOVA_CARRIERS=1 "/tmp/$t.bin" >/dev/null 2>&1 || f1=$((f1+1))
              done
              f4=0
              for i in $(seq 1 30); do
                NOVA_CARRIERS=4 "/tmp/$t.bin" >/dev/null 2>&1 || f4=$((f4+1))
              done
              echo "::error title=flaky-bisect::$t CARRIERS=1 $f1/30 FAILED vs CARRIERS=4 $f4/30 FAILED"
            fi
            # ASAN, pointed at the test that actually fails rather than at argon2id.
            clang -O1 -g -fsanitize=address $PCF -o "/tmp/$t.asan" "/tmp/$t.ll" ../compiler/nova_runtime.c $PLF -w 2>/dev/null
            if [ -x "/tmp/$t.asan" ]; then
              af=0; asan_find=""
              for i in 1 2 3 4 5; do
                out=$(ASAN_OPTIONS=detect_leaks=0 "/tmp/$t.asan" 2>&1); rc=$?
                if [ $rc -ne 0 ]; then
                  af=$((af+1))
                  [ -z "$asan_find" ] && asan_find=$(printf '%s' "$out" | grep -m1 -E 'ERROR: AddressSanitizer|SUMMARY: AddressSanitizer' | cut -c1-220)
                fi
              done
              echo "::notice title=flaky-asan::$t ASAN: $af/5 FAILED ${asan_find:+:: $asan_find}${asan_find:+ (SANITIZER FINDING)}"
              # THE FRAMES ARE THE WHOLE POINT. The earlier version captured only the first ERROR
              # line, so we learned "global-buffer-overflow" (5/5 reproducible in forge_pg_scram_test)
              # but never WHICH buffer or WHICH function. Every bounds check reviewable by hand
              # (nova_strpool_contains, the nova_int_str_cache range checks) is provably in-bounds,
              # and it does NOT reproduce under ASAN on Linux -- so without frames this is guesswork.
              # `paste -sd;` joins the lines: no escape sequence survives a heredoc reliably.
              if [ -n "$asan_find" ]; then
                ASAN_OPTIONS=detect_leaks=0 "/tmp/$t.asan" >/tmp/frames.txt 2>&1
                FR=$(grep -E "^ *#[0-9]+ " /tmp/frames.txt | head -8 | sed "s|^ *||" | paste -sd";" - | cut -c1-900)
                echo "::error title=flaky-asan-frames::$t :: $FR"
                OB=$(grep -m1 -E "is located" /tmp/frames.txt | cut -c1-300)
                [ -n "$OB" ] && echo "::error title=flaky-asan-object::$t :: $OB"
              fi
            fi
            TOTALF=$((TOTALF + f))
          done
          # DECIDE, do not merely report. 3 tests x 60 runs = 180 executions of exactly the code
          # that has been failing intermittently at ~0.1%. At that rate the expected count is ~0.2,
          # so a clean sweep is not proof -- but a NON-ZERO count finally pins the rate to a number
          # and, with the ASAN lines above, says whether a sanitizer can see it.
          if [ "$TOTALF" -gt 0 ]; then
            echo "::error title=flaky-VERDICT::REPRODUCED $TOTALF/180 -- the intermittent is real and now has a rate; see flaky-rate/flaky-asan above"
          else
            echo "::notice title=flaky-VERDICT::0/180 failures across 3 crypto tests -- did not reproduce in 180 consecutive runs"
          fi
          exit 0
        timeout-minutes: 90

      - name: UBSan probe on Darwin (Apple clang) -- diagnostic, never fails the job
        continue-on-error: true
        run: |
          set +e
          bash .github/scripts/ubsan_gate.sh
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=ubsan-darwin::clean under Apple clang UBSan -- no undefined behaviour on the arithmetic/crypto paths"
          else
            echo "::notice title=ubsan-darwin::UBSan reported findings above (rc=$rc); see the ::error annotations from the gate"
          fi
          exit 0
        timeout-minutes: 45

  # ─── macOS (Kotlin bootstrap, legacy reference) ───────

  # ─── TIER 2: the FULL suite on POSIX. NON-BLOCKING until it is green. ───────────────
  # The selfhosted jobs above run a hand-listed 60-test core suite, because they never synced
  # forge/ + prism/ into $NOVA_HOME/lib -- so anything doing `import forge...` could not resolve.
  # Windows runs all ~3,590. This job closes that gap and turns "the COMPILER works on three
  # platforms" into "NOVA works on three platforms".
  #
  # NOW BLOCKING (2026-08-30) for every platform that has passed. It went green 12/12 on ffc3e88f,
  # and the run reported "17/17" while THIRTEEN of those jobs were advisory -- a board that cannot
  # turn red is a dashboard, not a gate. Same principle already written on windows-fullrc below.
  # macos-15-intel is the sole exception: brand new, never built, so it reports without blocking
  # until it passes once -- exactly the discipline the other platforms just graduated from.
  posix-full-suite:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm joins here rather than running its own unsharded pass. It had the whole
        # ~3,570-test suite on ONE runner and hit the 330-minute cap at 3525/3570 -- roughly 200
        # minutes in the parallel phase before it even reached the serial server tests. Sharded
        # four ways it gets the same wall-clock budget as every other platform.
        #
        # macos-15-intel is the x86_64 Darwin runner. NOTE: `macos-13` -- the label most docs and
        # model priors still name -- was RETIRED on 2025-12-04; macos-15-intel replaces it and is
        # itself available only until AUGUST 2027, after which GitHub drops x86_64 macOS entirely.
        # When it goes, delete this entry and nova_compiler_macos_x64.ll with it.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    env:
      NOVA_SHARD_INDEX: ${{ matrix.shard }}
      NOVA_SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld

      - name: Build self-hosted compiler from the checked-in seed
        run: |
          cd nova-compiler/compiler
          # Branch on ARCH as well as OS. This used to test only `uname -s`, so an aarch64 Linux
          # runner would have been handed the x86_64 seed -- a triple mismatch that fails at the
          # first instruction selection, with an error naming clang rather than the seed.
          # Darwin/x86_64 MUST be tested before Darwin/* -- the Intel runner would otherwise be
          # handed the aarch64 seed and die at instruction selection.
          case "$(uname -s)/$(uname -m)" in
            Darwin/x86_64)     SEED=nova_compiler_macos_x64.ll;   LINK="-lm -D_DARWIN_C_SOURCE" ;;
            Darwin/*)          SEED=nova_compiler_macos.ll;       LINK="-lm -D_DARWIN_C_SOURCE" ;;
            Linux/aarch64|Linux/arm64) SEED=nova_compiler_linux_arm64.ll; LINK="-lpthread -ldl -lm" ;;
            *)                 SEED=nova_compiler_linux.ll;       LINK="-lpthread -ldl -lm" ;;
          esac
          echo "::notice title=seed::$(uname -s)/$(uname -m) -> $SEED :: $(grep -m1 'target triple' $SEED)"
          # Guard the triple, exactly as the per-platform selfhosted jobs do: a seed emitted for the
          # wrong target is the one failure mode this whole step exists to avoid.
          case "$(uname -s)/$(uname -m)" in
            Darwin/x86_64)             WANT=x86_64-apple-darwin ;;
            Darwin/*)                  WANT=aarch64-apple-darwin ;;
            Linux/aarch64|Linux/arm64) WANT=aarch64-unknown-linux-gnu ;;
            *)                         WANT=x86_64-unknown-linux-gnu ;;
          esac
          grep -q "$WANT" "$SEED" || { echo "::error title=seed::$SEED is not $WANT-targeted"; exit 1; }
          clang -O2 -o nova "$SEED" nova_runtime.c $LINK -Wno-everything
          ./nova --version || true

      - name: Run FULL suite
        run: bash .github/scripts/posix_full_suite.sh
        timeout-minutes: 330

  # ─── 5.7: Linux on AArch64. NO HARDWARE NEEDED — the plan's "needs hardware" was wrong. ───
  # GitHub's ubuntu-24.04-arm runners are free for public repos. macOS already proves the
  # aarch64 CODEGEN path (macos-latest is arm64); this proves aarch64 + ELF + glibc, which is a
  # genuinely different combination: different object format, different libc, different syscall
  # ABI. NOW BLOCKING (2026-08-30): it passed on its FIRST run and has stayed green since, so the
  # "non-blocking until green" clause has been satisfied and is hereby collected.
  linux-arm64-selfhosted:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
          echo "::notice title=linux-arm64 runner::arch=$(uname -m) clang=$(clang --version | head -1)"

      - name: Build self-hosted compiler from the aarch64 Linux seed
        run: |
          cd nova-compiler/compiler
          test -f nova_compiler_linux_arm64.ll || { echo "::error::aarch64 bootstrap IR missing"; exit 1; }
          grep -q 'aarch64-unknown-linux-gnu' nova_compiler_linux_arm64.ll \
            || { echo "::error::seed is not aarch64-linux-targeted"; exit 1; }
          clang -O2 -o nova nova_compiler_linux_arm64.ll nova_runtime.c -lpthread -ldl -lm -Wno-everything
          ./nova --version || true

      - name: Native host targeting
        run: |
          cd nova-compiler/compiler
          printf 'fn main()\n    print(os_name())\n' > /tmp/hostprobe.nova
          ./nova compile -o /tmp/hostprobe.ll /tmp/hostprobe.nova
          grep -q 'target triple = "aarch64-unknown-linux-gnu"' /tmp/hostprobe.ll \
            || { echo "::error title=arm64 targeting::did not target aarch64-linux: $(grep '^target ' /tmp/hostprobe.ll)"; exit 1; }
          echo "::notice title=linux-arm64 targeting::OK aarch64-unknown-linux-gnu"

      # The canonical 3-pass, matching CLAUDE.md and the macOS job. The seed is cross-produced by
      # the WINDOWS-hosted compiler, so generation 1 still carries the producing host's behaviour
      # and needs one more pass to wash out -- exactly what caught macOS out at 2 passes.
      - name: Reconverge check (3-pass, gen5 == gen6)
        run: |
          cd nova-compiler/compiler
          export NOVA_NO_CACHE=1
          CC="nova_runtime.c -lpthread -ldl -lm -Wno-everything"
          ./nova nova_compiler.nova gen4.ll && clang -O2 -o nova_gen4 gen4.ll $CC
          ./nova_gen4 nova_compiler.nova gen5.ll && clang -O2 -o nova_gen5 gen5.ll $CC
          ./nova_gen5 nova_compiler.nova gen6.ll
          if diff -q gen5.ll gen6.ll; then
            echo "::notice title=linux-arm64 reconverge::RECONVERGED gen5 == gen6 (byte-identical, 3-pass)"
          else
            D45=$(diff gen4.ll gen5.ll | grep -c '^<' || true); D56=$(diff gen5.ll gen6.ll | grep -c '^<' || true)
            echo "::error title=linux-arm64 reconverge::DIVERGED. drift gen4->gen5=$D45 gen5->gen6=$D56. First: $(diff gen5.ll gen6.ll | head -4 | paste -sd ' ' -)"
            exit 1
          fi
          rm -f nova_gen4 nova_gen5 gen4.ll gen5.ll gen6.ll
        timeout-minutes: 60

      # The full suite moved to the sharded posix-full-suite matrix (see its `os:` list). This job
      # keeps the thing only it can prove: that aarch64+ELF+glibc reaches a byte-identical
      # fixpoint. Leaving an unsharded copy here would just re-time-out and mask that result.

  # ─── TIER 3: NOVA_T8_FULLRC (leak-checking) — currently ZERO CI coverage anywhere ─────
  # The local arc runs BOTH memory modes, but CI has only ever run NORMAL, on any platform.
  # FULLRC exercises a different refcount path and historically catches a different bug class
  # (use-after-free, leaks) that NORMAL cannot see. Separate job rather than a second pass in
  # the existing one, so it runs in PARALLEL instead of doubling that job's wall time.
  windows-fullrc:
    runs-on: windows-latest
    # BLOCKING as of 2026-08-28: passed 3592 PASS / 0 FAIL / 0 SKIP on its FIRST run, so the
    # leak-checking mode is now enforced rather than merely observed. A gate that has proven it
    # can pass and is left non-blocking is not a gate, it is a decoration.
    steps:
      - uses: actions/checkout@v4
      - name: Run full regression (NOVA_T8_FULLRC)
        shell: pwsh
        run: |
          Set-Location nova-compiler/test_programs
          $env:NOVA_T8_FULLRC = "1"
          $env:PGPASSWORD = ""     # same reason as the NORMAL job: the image exports it with the service stopped
          pwsh -NoProfile -File .\_run_final_regression.ps1 2>&1 | Tee-Object -FilePath fullrc.log
          $code = $LASTEXITCODE
          $all = @(Get-Content fullrc.log -ErrorAction SilentlyContinue)
          $summary = @($all | Where-Object { $_ -match 'RESULTS:' }) -join ' '
          if ($summary) { Write-Host "::notice title=Windows FULLRC summary::$summary" }
          $fails = @($all | Where-Object { $_ -match '^(FAIL|TIMEOUT)' } | Select-Object -First 20)
          if ($fails.Count -gt 0) { Write-Host "::error title=Windows FULLRC FAILS::$(($fails -join ' | '))" }
          exit $code
        timeout-minutes: 120

  # ─── TIER 3b: NOVA_T8_FULLRC on POSIX — the other half of the leak-checking gap ───────
  # FULLRC had CI coverage on Windows only, so a leak or use-after-free that manifests solely on
  # POSIX went unseen. That is not hypothetical for this codebase: the last three bugs this
  # campaign closed were each latent on every platform and visible on exactly one, and one of
  # them (borrowed const char* in the devx tables) was a lifetime bug of precisely the class
  # FULLRC exists to catch — found only because Darwin reuses freed memory that Linux and
  # Windows leave intact.
  #
  # NOVA_T8_FULLRC is read by the COMPILER at compile time (it changes codegen to emit rc_dec on
  # slot overwrite), not by the runtime — so exporting it for the whole job is what puts every
  # test under the leak-checking path.
  #
  # ubuntu-latest only, not the full 3-platform matrix: this closes "POSIX has zero FULLRC
  # coverage" for a quarter of the cost, and the platform-specific risk is already carried by the
  # NORMAL suite running on all four. Widen it if it ever catches something arch-specific.
  #
  # continue-on-error until it passes once — it has never run anywhere on POSIX, same discipline
  # every other new job in this file started under.
  posix-fullrc:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NOVA_SHARD_INDEX: ${{ matrix.shard }}
      NOVA_SHARD_TOTAL: 4
      NOVA_T8_FULLRC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld

      - name: Build self-hosted compiler from the checked-in seed
        run: |
          cd nova-compiler/compiler
          SEED=nova_compiler_linux.ll
          grep -q "x86_64-unknown-linux-gnu" "$SEED" || { echo "::error title=seed::$SEED is not x86_64-linux-targeted"; exit 1; }
          clang -O2 -o nova "$SEED" nova_runtime.c -lpthread -ldl -lm -Wno-everything
          ./nova --version || true

      - name: Run FULL suite under NOVA_T8_FULLRC
        run: bash .github/scripts/posix_full_suite.sh
        timeout-minutes: 330
