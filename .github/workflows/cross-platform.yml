name: NOVA Cross-Platform CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  # ─── Windows: full 114-test regression + benchmarks ───────────────
  windows-full-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          clang --version
          Write-Host "CPU: $([System.Environment]::ProcessorCount) cores"

      - name: Run full regression suite (114 tests)
        shell: pwsh
        run: |
          Set-Location nova-compiler/test_programs
          & .\\_run_final_regression.ps1
        timeout-minutes: 20

      - name: Run benchmark suite
        shell: pwsh
        run: |
          if (Test-Path "bench/run_bench.ps1") {
            Set-Location bench
            & .\\run_bench.ps1
          } else {
            Write-Host "No bench suite found, skipping"
          }
        timeout-minutes: 10

  # ─── Linux: build Kotlin compiler, compile + run core tests ───────
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
          clang --version

      - name: Build NOVA compiler (Kotlin)
        run: |
          cd nova-compiler
          chmod +x gradlew
          ./gradlew fatJar --no-daemon -q
          ls -la build/libs/*-all.jar

      - name: Compile and run core tests
        run: |
          cd nova-compiler/test_programs
          COMPILER_JAR="../build/libs/nova-compiler-0.1.0-all.jar"
          RUNTIME="../nova_runtime.c"

          # Use the output runtime if available
          if [ -f "../compiler/nova_runtime.c" ]; then
            RUNTIME="../compiler/nova_runtime.c"
          fi

          PASS=0; FAIL=0; SKIP=0; FAILURES=""

          # Core language tests (no networking, no Windows-specific)
          TESTS=(
            float_test while_test list_test string_test for_test
            closure_test combined_test nested_fn_test
            struct_test struct_advanced_test struct_mutate_test
            match_test match_advanced_test higher_order_test
            enum_test range_test string_methods_test dict_test
            math_test string_stdlib_test list_methods_test
            type_conv_test slice_test defaults_test
            in_operator_test struct_methods_test
            generics_test match_guard_test trait_test
            destructure_test assert_test string_index_test
            string_iter_test string_ops_test
            list_struct_test list_struct_loop_test
            string_accum_test string_accum_fn_test
            codegen_pattern_test match_expr_test
            map_filter_test bitwise_test
            closure_ir_test error_test tiny_test match_str_test
            default_params_test tuple_test method_test
            math_quick_test else_sibling_test
            mini_struct_test mini2_test
            stdlib_test mixed_arith_test
            shadow_test json_float_test nested_float_test
            dict_float_test bool_json_test nested_bool_test
            float_list_ops_test
          )

          for t in "${TESTS[@]}"; do
            nova="${t}.nova"
            ll="${t}.ll"
            exe="${t}"

            if [ ! -f "$nova" ]; then
              SKIP=$((SKIP + 1))
              continue
            fi

            # Compile NOVA -> LLVM IR
            if ! java -jar "$COMPILER_JAR" "$nova" > /dev/null 2>&1; then
              echo "FAIL compile: $t"
              FAILURES="$FAILURES $t(COMPILE)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if [ ! -f "$ll" ]; then
              echo "FAIL compile: $t (no .ll)"
              FAILURES="$FAILURES $t(NO_LL)"
              FAIL=$((FAIL + 1))
              continue
            fi

            # Link
            if ! clang -O2 -o "$exe" "$ll" "$RUNTIME" -lpthread -ldl -lm -Wno-everything 2>/dev/null; then
              echo "FAIL link: $t"
              FAILURES="$FAILURES $t(LINK)"
              FAIL=$((FAIL + 1))
              rm -f "$ll"
              continue
            fi

            # Run with timeout
            if timeout 15 ./"$exe" > /tmp/test_out.txt 2>/tmp/test_err.txt; then
              if grep -q "FAIL assert" /tmp/test_err.txt 2>/dev/null; then
                echo "FAIL assert: $t"
                FAILURES="$FAILURES $t(ASSERT)"
                FAIL=$((FAIL + 1))
              else
                echo "PASS $t"
                PASS=$((PASS + 1))
              fi
            else
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 124 ]; then
                echo "FAIL timeout: $t"
                FAILURES="$FAILURES $t(TIMEOUT)"
              else
                echo "FAIL run: $t (exit=$EXIT_CODE)"
                FAILURES="$FAILURES $t(RUN)"
              fi
              FAIL=$((FAIL + 1))
            fi

            rm -f "$ll" "$exe"
          done

          echo ""
          echo "=== RESULTS: $PASS PASS, $FAIL FAIL, $SKIP SKIP ==="
          if [ -n "$FAILURES" ]; then
            echo "Failures:$FAILURES"
          fi
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ─── macOS: build Kotlin compiler, compile + run core tests ───────
  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify clang
        run: clang --version

      - name: Build NOVA compiler (Kotlin)
        run: |
          cd nova-compiler
          chmod +x gradlew
          ./gradlew fatJar --no-daemon -q
          ls -la build/libs/*-all.jar

      - name: Compile and run core tests
        run: |
          cd nova-compiler/test_programs
          COMPILER_JAR="../build/libs/nova-compiler-0.1.0-all.jar"
          RUNTIME="../nova_runtime.c"

          if [ -f "../compiler/nova_runtime.c" ]; then
            RUNTIME="../compiler/nova_runtime.c"
          fi

          PASS=0; FAIL=0; SKIP=0; FAILURES=""

          TESTS=(
            float_test while_test list_test string_test for_test
            closure_test combined_test nested_fn_test
            struct_test struct_advanced_test struct_mutate_test
            match_test match_advanced_test higher_order_test
            enum_test range_test string_methods_test dict_test
            math_test string_stdlib_test list_methods_test
            type_conv_test slice_test defaults_test
            in_operator_test struct_methods_test
            generics_test match_guard_test trait_test
            destructure_test assert_test string_index_test
            string_iter_test string_ops_test
            list_struct_test list_struct_loop_test
            string_accum_test string_accum_fn_test
            codegen_pattern_test match_expr_test
            map_filter_test bitwise_test
            closure_ir_test error_test tiny_test match_str_test
            default_params_test tuple_test method_test
            math_quick_test else_sibling_test
            mini_struct_test mini2_test
            stdlib_test mixed_arith_test
            shadow_test json_float_test nested_float_test
            dict_float_test bool_json_test nested_bool_test
            float_list_ops_test
          )

          for t in "${TESTS[@]}"; do
            nova="${t}.nova"
            ll="${t}.ll"
            exe="${t}"

            if [ ! -f "$nova" ]; then
              SKIP=$((SKIP + 1))
              continue
            fi

            if ! java -jar "$COMPILER_JAR" "$nova" > /dev/null 2>&1; then
              echo "FAIL compile: $t"
              FAILURES="$FAILURES $t(COMPILE)"
              FAIL=$((FAIL + 1))
              continue
            fi

            if [ ! -f "$ll" ]; then
              echo "FAIL compile: $t (no .ll)"
              FAILURES="$FAILURES $t(NO_LL)"
              FAIL=$((FAIL + 1))
              continue
            fi

            # macOS: no -lpthread -ldl needed (part of system)
            if ! clang -O2 -o "$exe" "$ll" "$RUNTIME" -Wno-everything -D_DARWIN_C_SOURCE 2>/dev/null; then
              echo "FAIL link: $t"
              FAILURES="$FAILURES $t(LINK)"
              FAIL=$((FAIL + 1))
              rm -f "$ll"
              continue
            fi

            if timeout 15 ./"$exe" > /tmp/test_out.txt 2>/tmp/test_err.txt; then
              if grep -q "FAIL assert" /tmp/test_err.txt 2>/dev/null; then
                echo "FAIL assert: $t"
                FAILURES="$FAILURES $t(ASSERT)"
                FAIL=$((FAIL + 1))
              else
                echo "PASS $t"
                PASS=$((PASS + 1))
              fi
            else
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 124 ]; then
                echo "FAIL timeout: $t"
                FAILURES="$FAILURES $t(TIMEOUT)"
              else
                echo "FAIL run: $t (exit=$EXIT_CODE)"
                FAILURES="$FAILURES $t(RUN)"
              fi
              FAIL=$((FAIL + 1))
            fi

            rm -f "$ll" "$exe"
          done

          echo ""
          echo "=== RESULTS: $PASS PASS, $FAIL FAIL, $SKIP SKIP ==="
          if [ -n "$FAILURES" ]; then
            echo "Failures:$FAILURES"
          fi
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ─── Deterministic output check ──────────────────────────────────
  determinism-check:
    runs-on: ubuntu-latest
    needs: linux-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build compiler
        run: |
          cd nova-compiler
          chmod +x gradlew
          ./gradlew fatJar --no-daemon -q

      - name: Verify deterministic IR output
        run: |
          cd nova-compiler/test_programs
          JAR="../build/libs/nova-compiler-0.1.0-all.jar"
          TESTS=(float_test while_test list_test string_test dict_test struct_test)

          ALL_MATCH=true
          for t in "${TESTS[@]}"; do
            if [ ! -f "${t}.nova" ]; then continue; fi

            java -jar "$JAR" "${t}.nova" > /dev/null 2>&1
            cp "${t}.ll" "${t}.ll.run1"

            java -jar "$JAR" "${t}.nova" > /dev/null 2>&1
            cp "${t}.ll" "${t}.ll.run2"

            if ! diff -q "${t}.ll.run1" "${t}.ll.run2" > /dev/null 2>&1; then
              echo "FAIL: ${t} produced different IR on two runs"
              diff "${t}.ll.run1" "${t}.ll.run2" | head -20
              ALL_MATCH=false
            else
              echo "PASS determinism: ${t}"
            fi

            rm -f "${t}.ll" "${t}.ll.run1" "${t}.ll.run2"
          done

          if [ "$ALL_MATCH" = false ]; then exit 1; fi
          echo "All determinism checks passed"
