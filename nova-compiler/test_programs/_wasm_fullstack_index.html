<!doctype html><html><head><meta charset="utf-8"><title>NOVA full-stack (one language)</title></head>
<body>
  <h1>NOVA full-stack: backend + frontend, one language</h1>
  <div id="app"></div>
  <script type="module">
    import { runDom } from "./_wasm_runtime_browser.mjs";
    // The FRONTEND is NOVA compiled to wasm32. It builds a button; on click it calls the host
    // import http_get_json("/api/items", "on_items"), which fetch()es from the NOVA BACKEND and
    // calls back into NOVA with the response, which renders it under #app.
    // Real run: start the NOVA backend (e.g. `nova run demo_http_server.nova` serving /api/items),
    // then `python -m http.server` in this dir and open this page. (Automated proof = the Node oracle
    // _wasm_fullstack_oracle.cjs with a mock fetch. Rich in-browser JSON parsing awaits m7.)
    runDom("./_wasm_fullstack_demo.wasm").catch(e => {
      document.getElementById("app").textContent = "ERROR: " + e;
    });
  </script>
</body></html>
