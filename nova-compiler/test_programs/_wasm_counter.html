<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NOVA → WebAssembly: stateful counter</title>
<!-- RUN: serve this directory over HTTP (instantiateStreaming needs application/wasm), e.g.
       python -m http.server 8080      # then open http://localhost:8080/_wasm_counter.html
     The counter's STATE + increment LOGIC + RENDER all run in NOVA-compiled WebAssembly (_counter.wasm);
     this page only supplies the DOM host imports (dom_get_by_id / dom_set_text) and the click event. -->
<style>body{font:16px system-ui;margin:3rem} #count{font-size:2rem;margin:1rem 0} button{font-size:1rem;padding:.4rem 1rem}</style>
</head>
<body>
<h1>NOVA → WebAssembly counter</h1>
<p>State, event handling, and rendering all run in NOVA, compiled to wasm. This page is just the DOM host.</p>
<div id="count">count: …</div>
<button id="btn">+1</button>
<script type="module">
const handles = [null];           // wasm int handle -> real DOM node (0 = null)
const byNode = new Map();
let mem = null, x = null;
const dec = new TextDecoder();
function readCStr(p){ const u = new Uint8Array(mem.buffer); let o = Number(BigInt.asUintN(32, BigInt(p))), e = o; while (u[e] !== 0) e++; return dec.decode(u.subarray(o, e)); }
function handleFor(node){ if (!node) return 0; if (byNode.has(node)) return byNode.get(node); handles.push(node); const h = handles.length - 1; byNode.set(node, h); return h; }
// env: the DOM host-import surface NOVA calls; a Proxy stubs every other (dead) import to a no-op i64.
const env = new Proxy({
  dom_get_by_id: (p) => BigInt(handleFor(document.getElementById(readCStr(p)))),
  dom_set_text:  (h, p) => { const n = handles[Number(h)]; if (n) n.textContent = readCStr(p); return 0n; },
}, { get(t, k){ return k in t ? t[k] : () => 0n; } });
const { instance } = await WebAssembly.instantiateStreaming(fetch("_counter.wasm"), { env });
x = instance.exports; mem = x.memory;
x.init();                                                   // NOVA renders the initial "count: 0"
document.getElementById("btn").addEventListener("click", () => x.bump());   // each click -> NOVA bump()
</script>
</body>
</html>
