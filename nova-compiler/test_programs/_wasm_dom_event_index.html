<!doctype html><html><head><meta charset="utf-8"><title>NOVA -> WASM -> interactive DOM</title></head>
<body>
  <h1>NOVA interactive frontend proof</h1>
  <div id="app"></div>
  <script type="module">
    import { runDom } from "./_wasm_runtime_browser.mjs";
    // Serve this dir + open. NOVA's main() builds a <button> under #app and registers its click
    // handler (the NOVA fn `on_click`, by wasm export name). Each click runs NOVA, which appends
    // a <p>clicked</p> -- a full interactive loop (build DOM + handle events) with zero JS glue.
    runDom("./_wasm_dom_event_demo.wasm").catch(e => {
      document.getElementById("app").textContent = "ERROR: " + e;
    });
  </script>
</body></html>
