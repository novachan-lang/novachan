<!doctype html><html><head><meta charset="utf-8"><title>NOVA -> WASM -> DOM</title></head>
<body>
  <h1>NOVA full-stack frontend proof</h1>
  <div id="app">(waiting for NOVA...)</div>
  <script type="module">
    import { runDom } from "./_wasm_runtime_browser.mjs";
    // Serve this directory (e.g. `python -m http.server`) and open this page. NOVA's main()
    // BUILDS the DOM: it gets #app, creates a <p class="greeting">Built by NOVA</p>, and appends
    // it -- via the dom_* host-binding surface compiled to wasm32 (zero hand-written JS glue).
    runDom("./_wasm_dom_demo2.wasm").catch(e => {
      document.getElementById("app").textContent = "ERROR: " + e;
    });
  </script>
</body></html>
