<!doctype html><html><head><meta charset="utf-8"><title>NOVA -> WASM -> DOM</title></head>
<body>
  <h1>NOVA full-stack frontend proof</h1>
  <div id="app">(waiting for NOVA...)</div>
  <script type="module">
    import { runDom } from "./_wasm_runtime_browser.mjs";
    // Serve this directory (e.g. `python -m http.server`) and open this page; the #app text
    // is set by NOVA's main() calling the dom_set_text host import compiled to wasm32.
    runDom("./_wasm_dom_demo.wasm").catch(e => {
      document.getElementById("app").textContent = "ERROR: " + e;
    });
  </script>
</body></html>
